example: trace_values.py
alt: >-
  The program splits one line into text pieces, converts and assigns them to
  a and b with map, then prints their sum.
presets:
  - id: main
    label: Two small prices
    stdin: "3 5\n"
  - id: bigger
    label: Two bigger prices
    stdin: "10 20\n"
notes:
  "1": "`input().split()` breaks the line into a list of text pieces, kept under the name `parts`."
  "2": "Converting every piece in `parts` with `map(int, parts)` gives two numbers, and the assignment sends them into `a` and `b`."
