example: count_votes.py
alt: >-
  The program splits a line of names into votes, then counts how many
  times each name appears using a dict.
presets:
  - id: main
    label: Ana leads
    stdin: "Ana Bo Ana Ana\n"
  - id: tied
    label: Even split
    stdin: "Ana Bo Ana Bo\n"
  - id: one
    label: One vote
    stdin: "Ana\n"
notes:
  "4": "Here, `c.get(v, 0)` reads the count so far for `v`, or `0` the first time `v` appears. Adding `1` and storing it back grows the count by one."
