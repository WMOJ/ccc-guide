example: call_stack.py
alt: >-
  add_one calls double, which finishes and returns before add_one adds 1
  and returns its own result.
notes:
  "5": "Calling `double(x)` pushes a new frame onto the call stack; `add_one` waits, paused, until `double` returns."
  "2": "`double` returns its result here, popping its frame off the stack and handing control back to `add_one`."
