layout: row
panels:
  - id: global_scope
    viz: StructViz
    title: Global scope
  - id: local_scope
    viz: StructViz
    title: Local scope
alt: >-
  The global scope holds rate, scaled and n. Calling scaled creates a local scope holding only the
  parameter x. Python finds x in the local scope. It does not find rate there, so it looks in the
  global scope and finds it. The call returns x times rate and its local scope disappears.
captions: vizrec
presets:
  - id: main
    label: Input 4
    stdinFile: ../examples/read_global.in
  - id: zero
    label: Input 0
    stdin: "0\n"
consistency:
  description: "rec.output() equals read_global.py's real stdout for the same stdin."
  example: ../examples/read_global.py
  compare: output
