layout: single
panels:
  - { id: grid, viz: GridViz, title: Board }
alt: >-
  Placing queens on a board one row at a time. Each step places a queen in the first column not
  already attacked by an earlier row, or backtracks and removes the previous row's queen when a
  row has no safe column left. A complete board with one queen per row and no attacks is a
  solution.
captions: vizrec
presets:
  - id: solved
    label: 4x4 board
    stdin: "4\n"
  - id: none
    label: 3x3 board
    stdin: "3\n"
consistency:
  description: The number of solutions the visual records equals the output of examples/n_queens.py on the same board size.
  example: ../examples/n_queens.py
  compare: output
