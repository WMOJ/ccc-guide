id: M4.3
title: Prefix sums (1D, 2D, prefix/suffix max)
status: accepted
objectives:
  - Build a prefix sum array to answer range-sum queries in O(1) time.
  - Use prefix/suffix max arrays to find the best value in a range.
  - Extend prefix sums to 2D grids for rectangular range queries.
  - Recognize when preprocessing trades setup time for faster queries.
prereqs:
  - M1.8
  - M2.9
lessons:
  - prefix-sums
practice:
  - id: ccc17s1
    note: Two teams' cumulative runs over a baseball season, compared day by day.
    why: A direct 1D prefix-sum problem, the same running-total idea as this lesson's range queries.
  - id: ccc18j3
    note: Distances between cities along a straight road, given the segments between them.
    why: A small 1D prefix-sum problem, cumulative sums of the segments between any two cities.
