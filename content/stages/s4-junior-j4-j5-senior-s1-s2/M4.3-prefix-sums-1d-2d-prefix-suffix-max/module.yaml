id: M4.3
title: Prefix sums (1D, 2D, prefix/suffix max)
status: accepted
objectives:
  - Build a prefix sum array to answer range-sum queries in O(1) time.
  - Use prefix/suffix max arrays to find the best value in a range.
  - Extend prefix sums to 2D grids for rectangular range queries.
  - Recognize when preprocessing trades setup time for faster queries.
prereqs:
  - M1.8
  - M2.9
lessons:
  - prefix-sums
practice:
  - id: ccc17s1
    note: Track a running total as you scan, and use it to answer a question about the whole range.
    why: A direct running-total problem, the same idea as this lesson's prefix sum array.
  - id: ccc18j3
    note: Use cumulative totals across a table to answer a positional question.
    why: A cumulative-sum problem solved the same way as this lesson's range-sum queries.
