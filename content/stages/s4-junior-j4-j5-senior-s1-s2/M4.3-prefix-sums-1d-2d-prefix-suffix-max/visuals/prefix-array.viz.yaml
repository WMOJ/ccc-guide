layout: row
panels:
  - { id: values, viz: ArrayViz, title: Daily rainfall }
  - { id: prefix, viz: ArrayViz, title: Prefix sum }
alt: >-
  Building a prefix sum array from a list of daily rainfall totals, one day at a time, then
  answering a range-sum query by marking the query's range on the rainfall array and subtracting
  two entries of the prefix array.
captions: vizrec
presets:
  - id: middle
    label: Middle range
    stdin: "5\n10 20 15 30 25\n1\n1 3\n"
  - id: from-start
    label: From day 0
    stdin: "5\n10 20 15 30 25\n1\n0 2\n"
  - id: single
    label: One day
    stdin: "5\n10 20 15 30 25\n1\n2 2\n"
consistency:
  description: The query answer equals the output of examples/range_sum.py on the same input.
  example: ../examples/range_sum.py
  compare: output
