layout: row
panels:
  - { id: g, viz: GridViz, title: Gauge grid }
  - { id: t, viz: TableViz, title: 2D prefix sums }
alt: >-
  A grid of rain gauge readings beside a 2D prefix sum table built from it, one cell at a time,
  using the cell above, the cell to the left, and the cell diagonally above-left. The last step
  highlights the queried rectangle on the gauge grid itself, then answers it with the four corner
  cells of inclusion-exclusion on the prefix table.
captions: vizrec
presets:
  - id: rectangle
    label: Rectangle
    stdin: "3 4\n2 1 4 3\n5 6 2 1\n3 4 1 2\n1\n0 1 1 2\n"
  - id: whole-grid
    label: Whole grid
    stdin: "3 4\n2 1 4 3\n5 6 2 1\n3 4 1 2\n1\n0 0 2 3\n"
consistency:
  description: The rectangle sum equals the output of examples/grid_rect_sum.py on the same input.
  example: ../examples/grid_rect_sum.py
  compare: output
