layout: single
panels:
  - { id: g, viz: GridViz, title: Gauges counted so far }
legendLabels:
  done: Counted once
  invalid: Subtracted too often
  current: Query rectangle
alt: >-
  A grid of rain gauge readings. The query rectangle is marked first. Then four prefix entries are
  combined: the big top-left block is counted once, the strip above and the strip to the left are
  subtracted, and the corner they both removed is added back, leaving only the rectangle counted.
captions: vizrec
presets:
  - id: inside
    label: Inside
    stdin: "3 4\n2 1 4 3\n5 6 2 1\n3 4 1 2\n1\n1 1 2 2\n"
  - id: edge
    label: Top row
    stdin: "3 4\n2 1 4 3\n5 6 2 1\n3 4 1 2\n1\n0 1 1 2\n"
  - id: single
    label: One gauge
    stdin: "3 4\n2 1 4 3\n5 6 2 1\n3 4 1 2\n1\n1 2 1 2\n"
consistency:
  description: The rectangle sum equals the output of examples/grid_rect_sum.py on the same input.
  example: ../examples/grid_rect_sum.py
  compare: output
