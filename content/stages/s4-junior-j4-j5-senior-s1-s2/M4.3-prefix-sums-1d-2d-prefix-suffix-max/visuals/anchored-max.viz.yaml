layout: single
panels:
  - { id: t, viz: TableViz, title: "Prefix and suffix max" }
alt: >-
  A table of three rows: submission scores, then prefix_max built left to right, then suffix_max
  built right to left, each one entry longer than scores. For a chosen position, prefix_max at
  that position and suffix_max just after it are marked, and combined with a second max, not a
  subtraction, to find the best score outside that one position.
captions: vizrec
presets:
  - id: first
    label: First
    stdin: "6\n70 85 60 90 75 65\n1\n0\n"
  - id: middle
    label: Middle
    stdin: "6\n70 85 60 90 75 65\n1\n3\n"
  - id: last
    label: Last
    stdin: "6\n70 85 60 90 75 65\n1\n5\n"
consistency:
  description: The result equals the output of examples/prefix_suffix_max.py on the same input.
  example: ../examples/prefix_suffix_max.py
  compare: output
