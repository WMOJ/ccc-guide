id: M4.2
title: Sorting with keys and greedy
status: accepted
objectives:
  - Use sorted() with a key function to arrange data for greedy algorithms.
  - Solve ordering and selection problems where a greedy choice is optimal.
  - Recognize when sorting by one criterion then selecting solves the problem.
  - Handle ties and edge cases when the greedy choice is not unique.
prereqs:
  - M1.8
  - M2.4
lessons:
  - sorting-with-keys-and-greedy
practice:
  - id: ccc21j4
    note: Assign tasks to workers to minimize the maximum time any worker spends.
    why: A classic greedy scheduling problem solved by sorting tasks.
  - id: ccc22j3
    note: Select the longest jump or highest score from a contestant's attempts.
    why: Direct max-finding after sorting by a key criterion.
