id: M4.2
title: Sorting with keys and greedy
status: accepted
objectives:
  - Use sorted() with a key function to arrange data for greedy algorithms.
  - Solve ordering and selection problems where a greedy choice is optimal.
  - Recognize when sorting by one criterion then selecting solves the problem.
  - Handle ties and edge cases when the greedy choice is not unique.
prereqs:
  - M1.8
  - M2.4
lessons:
  - sorting-with-keys-and-greedy
practice:
  - id: ccc16s2
    note: Sort two lists of times and pair them to get the fastest and the slowest combined result.
    why: A two-key greedy-after-sort problem, the same shape as this lesson's ratio sort.
  - id: ccc20s1
    note: Scan and sort a set of measurements to work out a consistent value.
    why: A scan-then-sort problem in the same style as this lesson's key-based sorting.
