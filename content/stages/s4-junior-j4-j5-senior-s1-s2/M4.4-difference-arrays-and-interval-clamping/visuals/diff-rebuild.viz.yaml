layout: row
panels:
  - { id: diff, viz: ArrayViz, title: diff }
  - { id: arr, viz: ArrayViz, title: rebuilt array }
alt: >-
  A difference array of zeros receiving a +v and a -v for each range update, then a running-sum
  pass over the difference array filling in the final array one entry at a time.
captions: vizrec
presets:
  - id: overlapping
    label: Overlapping
    stdin: "5 3\n0 2 3\n1 4 2\n3 3 1\n"
  - id: touching-end
    label: Touches the end
    stdin: "4 1\n0 3 5\n"
consistency:
  description: The rebuilt array equals the line examples/range_updates.py prints.
  example: ../examples/range_updates.py
  compare: output
