layout: row
panels:
  - { id: direct, viz: ArrayViz, title: Direct loop }
  - { id: diff, viz: ArrayViz, title: Difference array }
alt: >-
  Two arrays side by side, one updated by a direct loop that writes every index in each range, one
  by a difference array that writes only two entries per update. Each step marks the cells
  written and gives the running write counts, so a wide range costs the direct loop many writes and
  diff two.
captions: vizrec
presets:
  - id: mixed
    label: Mixed
    stdin: "5 3\n0 2 3\n1 4 2\n3 3 1\n"
  - id: wide
    label: Wide ranges
    stdin: "7 3\n0 6 2\n1 5 3\n0 6 1\n"
  - id: single
    label: Single cells
    stdin: "6 2\n2 2 5\n4 4 1\n"
consistency:
  description: The final array equals the line examples/range_updates.py prints.
  example: ../examples/range_updates.py
  compare: output
