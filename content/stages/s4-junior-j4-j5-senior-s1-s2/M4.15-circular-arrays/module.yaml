id: M4.15
status: accepted
objectives:
  - Understand how circular arrays wrap around at the end back to the start.
  - Use modulo arithmetic to compute circular indices.
  - Implement a circular buffer or sliding window that wraps.
  - Apply circular thinking to solve rotation and cyclic problems.
practice:
  - id: ccc20j4
    note: Check whether one string is a circular shift of another.
    why: A cyclic shift is a rotation of the string's characters, the same wraparound this lesson builds indices for.
  - id: ccc20s4
    note: Rearrange three groups seated around a circular table so each group ends up sitting together.
    why: The seats sit in a circle, so "the last seat" and "the first seat" are neighbors, exactly the wraparound this lesson indexes.
