id: M4.1
title: Hash-based lookup
status: accepted
objectives:
  - Use a dictionary to store and retrieve data in O(1) time.
  - Solve lookup problems where you count or collect items by key.
  - Recognize when a dictionary is faster than a list or multiple conditions.
  - Handle missing keys safely with get() or membership checks.
prereqs:
  - M1.9
  - M2.9
lessons:
  - hash-based-lookup
practice:
  - id: ccc20j2
    note: Count how many athletes finished in each age category.
    why: A direct counting problem where a dictionary groups results by key.
  - id: ccc19j3
    note: Find duplicate pairs of measurements and report the count.
    why: Classic "count occurrences" pattern using a dictionary.
  - id: ccc23j4
    note: Track and retrieve the value associated with each game piece.
    why: Lookups by name with default handling for unknown pieces.
