layout: row
panels:
  - { id: items, viz: ArrayViz, title: Input values }
  - { id: seen, viz: StructViz, title: seen }
alt: >-
  Scanning a list left to right, checking each value against a growing set of values seen so far.
  A new value joins the set; a repeat is found already sitting inside it, one lookup either way.
captions: vizrec
presets:
  - id: has-repeat
    label: Has repeat
    stdin: "6\n7 3 7 9 3 3\n"
  - id: no-repeat
    label: No repeat
    stdin: "4\n1 2 3 4\n"
  - id: all-same
    label: All same
    stdin: "4\n5 5 5 5\n"
consistency:
  description: The seen/new sequence equals the output of examples/seen_before.py on the same input.
  example: ../examples/seen_before.py
  compare: output
