layout: row
panels:
  - { id: mid, viz: GridViz, title: Transposed }
  - { id: out, viz: GridViz, title: Rows reversed }
alt: >-
  Two grids side by side. The left one is the source after a transpose. Each of its rows is
  highlighted in turn and copied, reversed, into the same row of the right grid, which ends as
  the source rotated 90 degrees clockwise.
captions: vizrec
presets:
  - id: rectangle
    label: Rectangle
    stdin: "2 3\n1 2 3\n4 5 6\n"
  - id: square
    label: Square
    stdin: "3 3\n1 2 3\n4 5 6\n7 8 9\n"
  - id: one-row
    label: One row
    stdin: "1 3\n1 2 3\n"
consistency:
  description: The grid the visual ends with equals the output of examples/rotate_clockwise.py on each preset.
  example: ../examples/rotate_clockwise.py
  compare: output
