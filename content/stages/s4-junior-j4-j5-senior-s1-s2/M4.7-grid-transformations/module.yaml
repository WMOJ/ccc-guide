id: M4.7
title: Grid transformations
status: accepted
objectives:
  - Rotate a grid 90 degrees clockwise or counterclockwise.
  - Reflect a grid horizontally or vertically.
  - Transpose a grid and understand its relationship to other transformations.
  - Combine multiple transformations to solve symmetry problems.
prereqs:
  - M3.7
lessons:
  - grid-transformations
practice:
  - id: ccc18s2
    note: Figure out which 90-degree rotation restores a table of plant growth measurements to its correct order.
    why: Rotating a grid by quarter turns is the whole problem, the technique this lesson builds.
