layout: single
panels:
  - { id: days, viz: ArrayViz, title: Recorded days }
alt: >-
  Using bisect_right to count how many recorded days fall on or before a query day, even when
  the query day was never one of the recorded values.
captions: vizrec
presets:
  - id: main
    label: Mixed queries
    stdin: "4\n10 45 20 20\n5\n5 10 25 45 1000000000\n"
  - id: empty
    label: No days recorded
    stdin: "0\n\n1\n42\n"
  - id: duplicate
    label: All one day
    stdin: "3\n7 7 7\n3\n6 7 8\n"
consistency:
  description: The counts printed match the output of examples/bisect_lookup.py on the same input.
  example: ../examples/bisect_lookup.py
  compare: output
