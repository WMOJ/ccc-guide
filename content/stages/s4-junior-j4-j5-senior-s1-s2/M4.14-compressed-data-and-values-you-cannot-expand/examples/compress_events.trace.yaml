example: compress_events.py
alt: >-
  The program reads every reading first, sorts the distinct days into a small compressed range,
  then files each reading's event type into a set indexed by its day's compressed rank, so a
  count of distinct event types per day never needs an array sized to the full day range.
presets:
  - id: main
    label: Three days
    stdin: "5\n100 1\n200 2\n100 3\n200 2\n150 1\n"
  - id: one-day
    label: One day
    stdin: "3\n5 1\n5 2\n5 3\n"
notes:
  "5": "Every token is read at once."
  "9": "days and types collect the readings."
  "12": "day is the first token of a reading."
  "14": "event_type is the reading's event type."
  "19": "uniq holds the distinct days, sorted."
  "21": "Each unique day gets its rank, 0 up."
  "22": "rank maps a day to its small index."
  "26": "seen starts with one empty set per day."
  "30": "r is day d's compressed rank."
  "31": "t joins the set for day d's rank."
  "33": "counts is the size of each day's set."
