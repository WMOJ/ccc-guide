id: M4.14
status: accepted
objectives:
  - Identify when a value is too large to store or iterate over directly.
  - Use coordinate compression to map large values to a smaller range.
  - Understand when expansion is possible and when it is not.
  - Apply compression to solve problems where naive expansion would time out.
practice:
  - id: ccc22j5
    note: Narrow a huge coordinate plane down to a small set of candidate points worth checking.
  - id: ccc14s4
    note: Find the total area covered at or above a threshold, from a handful of huge rectangles.
    why: The rectangle corners are exactly the coordinates to compress, extended to two dimensions.
