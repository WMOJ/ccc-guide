id: M4.12
title: "Graphs I: modeling and adjacency lists"
status: accepted
objectives:
  - Recognize when a problem has a graph structure (vertices and edges).
  - Represent a graph as an adjacency list and populate it from input.
  - Understand the tradeoff between adjacency lists and adjacency matrices.
  - Iterate over a vertex's neighbors and apply an algorithm to each.
prereqs:
  - M1.8
  - M1.9
lessons:
  - graphs-and-adjacency-lists
practice:
  - id: ccc18j5
    note: Model a choose-your-own-adventure book as a graph of pages and links.
    why: An older problem that is really asking you to build the adjacency list before anything else.
