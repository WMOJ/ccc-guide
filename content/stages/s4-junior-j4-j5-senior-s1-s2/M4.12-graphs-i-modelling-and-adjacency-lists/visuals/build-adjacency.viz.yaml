layout: row
panels:
  - { id: graph, viz: GraphViz, title: Graph }
  - { id: table, viz: TableViz, title: Adjacency list }
alt: >-
  Building an undirected adjacency list one edge at a time. Each edge read from the input
  colors its two vertices and adds each vertex to the other's neighbor list, so the table on
  the right grows in step with the graph on the left.
captions: vizrec
presets:
  - id: given
    label: Given
    stdin: "4 3\n0 1\n1 2\n2 3\n"
  - id: hub
    label: Hub
    stdin: "5 5\n0 1\n0 2\n0 3\n0 4\n1 2\n"
  - id: none
    label: No edges
    stdin: "3 0\n"
consistency:
  description: The adjacency list the visual builds equals the lines examples/build_graph.py prints on each preset.
  example: ../examples/build_graph.py
  compare: output
