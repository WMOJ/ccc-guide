layout: row
panels:
  - { id: arr, viz: ArrayViz, title: Sequence }
  - { id: counts, viz: TableViz, title: Inversions and swaps }
alt: >-
  A sequence being sorted by repeated adjacent swaps, with a running count of its inversions and
  swaps so far. Each swap that fixes an out-of-order adjacent pair drops the inversion count by
  exactly one, so the count only ever falls, and the sequence is sorted after exactly as many
  swaps as it started with inversions.
captions: vizrec
presets:
  - id: scrambled
    label: Scrambled
    stdin: "4\n4 1 3 2\n"
  - id: sorted
    label: Already sorted
    stdin: "3\n1 2 3\n"
consistency:
  description: The inversions, swaps and final array equal the output of examples/inversion_count.py on the same input.
  example: ../examples/inversion_count.py
  compare: output
