layout: single
panels:
  - { id: board, viz: GridViz, title: Checkerboard walk }
alt: >-
  A token walking a shortest path to a target on a checkerboard, then spending any spare moves in
  pairs, stepping out to a neighbor and back. An even surplus of spare moves lands back on the
  target; an odd surplus strands the token on the neighbor instead; too few moves rules out the
  target before a single step is taken.
legendLabels:
  wall: Shaded square
  compare: Target
captions: vizrec
presets:
  - id: even-surplus
    label: Even surplus
    stdin: "0 0 2 3 7\n"
  - id: odd-surplus
    label: Odd surplus
    stdin: "0 0 2 3 6\n"
  - id: too-few
    label: Too few
    stdin: "0 0 2 3 3\n"
consistency:
  description: The reachability answer equals the output of examples/checkerboard_parity.py on the same input.
  example: ../examples/checkerboard_parity.py
  compare: output
