id: M4.8
status: accepted
objectives:
  - Use a stack to store data in LIFO order and solve matching problems.
  - Use a queue to store data in FIFO order and solve ordering problems.
  - Choose the right data structure for the problem.
  - Implement and use `collections.deque` for efficient operations.
practice:
  - id: ccc15s1
    note: Total a sequence of numbers your boss reads aloud, where "zero" means undo the last one.
    why: Practice using a stack to undo the most recent addition, not just to count how many there were.
  - id: ccc14s3
    note: Decide whether a line of railway cars can reach the lake in sorted order, using one holding track.
    why: Practice using a stack as the one place values can wait before they are released in order.
