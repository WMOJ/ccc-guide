layout: row
panels:
  - { id: plain, viz: ArrayViz, title: "List: pop(0)" }
  - { id: dq, viz: StructViz, title: "Deque: popleft()" }
alt: >-
  The same line of orders served from a plain list with pop(0) and from a deque with popleft().
  Each pop(0) slides every remaining list item one slot left, so the move count grows, while
  each popleft() removes the front without moving anything.
captions: vizrec
presets:
  - id: four
    label: Four orders
    stdin: "p q r s\n"
  - id: three
    label: Three orders
    stdin: "p q r\n"
  - id: one
    label: One order
    stdin: "p\n"
consistency:
  description: The served order the visual ends with equals the output of examples/queue_example.py on each preset.
  example: ../examples/queue_example.py
  compare: output
