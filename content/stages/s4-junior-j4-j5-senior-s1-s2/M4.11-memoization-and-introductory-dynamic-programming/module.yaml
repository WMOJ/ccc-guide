id: M4.11
status: accepted
objectives:
  - Recognize when a recursive function recomputes the same subproblems.
  - Use memoization to cache results and avoid redundant work.
  - Reframe a memoized recursion as dynamic programming building up from smaller subproblems.
  - Understand why this transforms exponential time into polynomial time.
practice:
  - id: ccc15j5
    note: Give out pieces of pie to a line of people so each person's share never decreases.
    why: A count of arrangements built from smaller pie-and-people subproblems, the shape a memoized recursion fits.
  - id: ccc22s1
    note: Count the ways to write a number as an unordered sum of two fixed piece sizes.
