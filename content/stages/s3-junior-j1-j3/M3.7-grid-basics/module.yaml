id: M3.7
title: Grid basics
status: accepted
objectives:
  - Read and store a rectangular grid of characters.
  - Use row and column indices to access and update grid cells.
  - Iterate over rows and columns with nested loops.
  - Apply grid basics to search and count features in a two-dimensional space.
prereqs:
  - M1.8
lessons:
  - grid-basics
practice:
  - id: ccc23j4
    note: Find the length of tape needed to cover the painted tiles in a two-row triangular pattern.
  - id: ccc16j2
    note: Check whether every row and column of a small numeric grid sums to the same total.
    why: Reads a small grid and scans every row and column, the same way this lesson does.
