id: M3.6
title: Frequency arrays and counting
status: accepted
objectives:
  - Build a frequency array to count how often each value appears.
  - Use an array index to represent a value so counting happens in one pass.
  - Apply frequency counting to solve real problems with character and digit counts.
  - Recognize when a frequency array is the right tool and when it is not.
prereqs:
  - M1.8
  - M1.9
lessons:
  - frequency-arrays-and-counting
practice:
  - id: ccc16s1
    note: Decide whether a word with some letters hidden could be an anagram of another.
    why: A letter-count comparison problem, close to this lesson's anagram check.
  - id: ccc17s3
    note: Join pairs of boards to build the longest fence of equal-height pieces.
    why: A frequency-array problem where the counts themselves make a fast solution possible.
  - id: ccc14j2
    note: Tally two kinds of votes from a sequence of ballots and report the outcome.
    why: A minimal two-value frequency count, the smallest version of this lesson's array.
