id: M3.6
title: Frequency arrays and counting
status: accepted
objectives:
  - Build a frequency array to count how often each value appears.
  - Use an array index to represent a value so counting happens in one pass.
  - Apply frequency counting to solve real problems with character and digit counts.
  - Recognize when a frequency array is the right tool and when it is not.
prereqs:
  - M1.8
  - M1.9
lessons:
  - frequency-arrays-and-counting
practice:
  - id: ccc16s1
    note: Count how many times each letter appears, using the counts to fill a gap.
    why: A letter-frequency problem, the direct application of this lesson's array.
  - id: ccc17s3
    note: Count how often each length occurs, then use the counts to avoid a slow scan.
    why: A frequency-array problem where the counts themselves make a fast solution possible.
  - id: ccc19j2
    note: Expand a compressed string, then count how often each character appears in the result.
    why: A one-pass character count over the string this lesson's pattern builds toward.
