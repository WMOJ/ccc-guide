id: M3.1
status: accepted
objectives:
  - Turn a problem's written rule into a single arithmetic formula.
  - Branch on the formula's result with if/elif/else, choosing the right comparison at each boundary.
  - Print exactly the text a problem asks for, with no extra words or punctuation.
practice:
  - id: ccc22j1
    note: Work out how many cupcakes are left over after handing them out to a class.
  - id: ccc21j1
    note: Compute a pressure reading from a boiling point, then classify it as above, at, or below sea level.
  - id: ccc14j1
    note: Classify a triangle as equilateral, isosceles, scalene, or invalid from its three angles.
    why: Four comparisons checked in order, the same if/elif/else shape this lesson teaches, without a formula in front of it.
