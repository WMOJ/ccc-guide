id: M3.3
title: String processing I (counting runs and building)
status: accepted
objectives:
  - Iterate through a string character by character to count runs of identical characters.
  - Build a new string by appending characters inside a loop.
  - Detect when a character changes and reset a counter.
prereqs:
  - M1.7
  - M2.4
lessons:
  - string-processing-counting-runs-and-building
practice:
  - id: ccc22j3
    note: Compress a string by counting consecutive identical characters.
  - id: ccc20s1
    note: Scan a list of values and sort them to work out a consistent pattern.
    why: A scan-and-sort problem that reuses the character-by-character pass from this lesson.
  - id: ccc24j3
    note: Find a specific ranked value among a set of scores, by counting or sorting.
