id: M3.3
status: accepted
objectives:
  - Iterate through a string character by character to count runs of identical characters.
  - Build a new string by appending characters inside a loop.
  - Detect when a character changes and reset a counter.
practice:
  - id: ccc19j3
    note: Compress a message by writing each run as its length and its symbol.
    why: The same run-length encoding this lesson builds, on a line of symbols instead of a word.
  - id: ccc15j3
    note: Recode a word by replacing each consonant with a three-letter pattern.
    why: Builds a new string one character at a time, the same shape as this lesson's transform example.
