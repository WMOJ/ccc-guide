id: M3.4
title: String processing II (tokenizing with state)
status: accepted
objectives:
  - Parse a string into tokens based on separators or delimiters.
  - Track state while building tokens to handle multi-character delimiters or contextual rules.
  - Build a list of tokens by appending complete tokens when a delimiter is found.
prereqs:
  - M3.3
lessons:
  - string-processing-tokenizing-with-state
practice:
  - id: ccc22j3
    note: Split a string of harp tuning instructions into its individual instructions.
  - id: ccc25j3
    note: Rewrite a product code by keeping its letters and adding up its embedded numbers.
