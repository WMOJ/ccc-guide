id: M3.4
title: String processing II (tokenizing with state)
status: accepted
objectives:
  - Parse a string into tokens based on separators or delimiters.
  - Track state while building tokens to handle multi-character delimiters or contextual rules.
  - Build a list of tokens by appending complete tokens when a delimiter is found.
prereqs:
  - M3.3
lessons:
  - string-processing-tokenizing-with-state
practice:
  - id: ccc19j3
    note: Decompress a run-length encoded string one token at a time.
    why: A state-tracking tokenizing problem from the same era as this lesson's examples.
  - id: ccc23j3
    note: Read a line of tokens and track the maximum, joining names on a tie.
  - id: ccc25j3
    note: Tokenize a line into distinct character classes, including signed multi-digit numbers.
