id: M3.10
title: Fast input and output
status: accepted
objectives:
  - Use sys.stdin.read() to read large amounts of input quickly.
  - Parse input using split() for faster token processing.
  - Build output as a list and print it all at once.
  - Apply the house skeleton pattern for high-throughput I/O.
prereqs:
  - M1.3
  - M1.11
lessons:
  - fast-input-and-output
practice:
  - id: ccc15s2
    note: Process many assignments efficiently; the input size makes fast I/O worth using.
    why: A large-input problem where the house skeleton pattern avoids slow input() calls.
  - id: ccc25j4
    note: Scan a large run of daily records fast enough to stay inside the time limit.
