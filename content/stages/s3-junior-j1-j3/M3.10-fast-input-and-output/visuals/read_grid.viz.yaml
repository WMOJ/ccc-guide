layout: single
panels:
  - { id: grid, viz: TableViz, title: Grid so far }
alt: >-
  Filling a grid row by row from the flat token list that follows the row and column counts,
  one value at a time, then summing every cell once the grid is complete.
captions: vizrec
presets:
  - id: main
    label: 2 by 3
    stdin: "2\n3\n1 2 3\n4 5 6\n"
  - id: flat
    label: One line
    stdin: "2\n3\n1 2 3 4 5 6\n"
  - id: single
    label: 1 by 1
    stdin: "1\n1\n7\n"
consistency:
  description: The final total in the visual equals the output of examples/read_grid.py.
  example: ../examples/read_grid.py
  compare: output
