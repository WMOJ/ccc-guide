layout: row
panels:
  - { id: numbers, viz: ArrayViz, title: Numbers }
  - { id: cost, viz: TableViz, title: Cost so far }
alt: >-
  A list of numbers scanned from the front, one comparison per cell, while looking for a target.
  Beside it, a small table counts the list scan's comparisons against a set lookup's single
  comparison. The scan stops at a match, or runs to the end when the value is missing.
captions: vizrec
presets:
  - id: end
    label: Near the end
    stdin: "6 5 8 2 9 4 7 1 6\n"
  - id: front
    label: Near the front
    stdin: "8 5 8 2 9 4 7 1 6\n"
  - id: missing
    label: Not present
    stdin: "3 5 8 2 9 4 7 1 6\n"
consistency:
  description: The final position and comparison count equal the output of examples/index_scan.py on each preset's stdin.
  example: ../examples/index_scan.py
  compare: output
