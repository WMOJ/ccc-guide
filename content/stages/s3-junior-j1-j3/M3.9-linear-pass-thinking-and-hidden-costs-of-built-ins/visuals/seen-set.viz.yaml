layout: row
panels:
  - { id: numbers, viz: ArrayViz, title: Numbers }
  - { id: seen, viz: StructViz, title: Seen set }
alt: >-
  A list of numbers scanned once, left to right. Beside it, a set grows by one value each time the
  current number is new. When a number already in the set is read, the scan stops there and reports
  that number as the first duplicate; if the scan finishes with no repeat, the seen set holds every
  distinct value read.
captions: vizrec
presets:
  - id: dup
    label: Has duplicate
    stdin: "1 2 3 2 4 5\n"
  - id: clean
    label: No duplicate
    stdin: "1 2 3 4 5\n"
  - id: single
    label: Single element
    stdin: "9\n"
consistency:
  description: The reported first duplicate (or -1) equals the output of examples/first_duplicate.py.
  example: ../examples/first_duplicate.py
  compare: output
