id: M3.2
title: Loop-and-count problems (J2 pattern)
status: accepted
objectives:
  - Read multiple items in a loop and accumulate a count or total.
  - Initialize a counter before the loop and update it inside.
  - Use the final count to make a decision or produce output.
prereqs:
  - M1.6
  - M2.4
lessons:
  - loop-and-count-problems
practice:
  - id: ccc22j2
    note: Process two lines of data per player and flag those meeting a condition.
  - id: ccc20j3
    note: Scan a comma-separated line of numbers, tracking the minimum and maximum as you go.
    why: A running-minimum-and-maximum scan, the same one-pass shape as this lesson's counters.
  - id: ccc19j2
    note: Expand a run-length compressed string and process the result in a loop.
    why: A one-pass scan with a running total, in the same style as this lesson's examples.
