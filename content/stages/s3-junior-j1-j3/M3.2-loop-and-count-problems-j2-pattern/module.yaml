id: M3.2
title: Loop-and-count problems (J2 pattern)
status: accepted
objectives:
  - Read multiple items in a loop and accumulate a count or total.
  - Initialize a counter before the loop and update it inside.
  - Use the final count to make a decision or produce output.
prereqs:
  - M1.6
  - M2.4
lessons:
  - loop-and-count-problems
practice:
  - id: ccc22j2
    note: Rate soccer players from their goals and fouls.
  - id: ccc20j3
    note: Find the frame around a set of paint-drop coordinates on a canvas.
    why: A running minimum-and-maximum scan, initializing four accumulators before the loop and updating them inside it, the same shape as this lesson's counters.
  - id: ccc17j2
    note: Add a number to itself shifted left by one or more zeros.
    why: A loop that adds to a running total on every iteration, the same accumulator shape this lesson teaches, summing instead of counting.
