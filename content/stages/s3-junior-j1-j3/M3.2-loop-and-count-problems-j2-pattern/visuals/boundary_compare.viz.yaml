layout: single
panels:
  - { id: table, viz: TableViz, title: Two tests }
alt: >-
  A table with one row per mark and two columns, one for the test mark at least 50 and one for
  mark above 50. Marks away from 50 get the same answer in both columns, while a mark of exactly
  50 passes the first and fails the second, so the two counts differ.
captions: vizrec
presets:
  - id: near-50
    label: Near 50
    stdin: "3\n49\n50\n51\n"
  - id: apart
    label: Far apart
    stdin: "3\n10\n70\n95\n"
  - id: all-50
    label: All 50
    stdin: "3\n50\n50\n50\n"
consistency:
  description: The count under the correct test, at least 50, equals the output of examples/pass_count.py.
  example: ../examples/pass_count.py
  compare: output
