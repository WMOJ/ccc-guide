layout: row
panels:
  - { id: array, viz: ArrayViz, title: Marks }
  - { id: table, viz: TableViz, title: Variables }
alt: >-
  An array of marks scanned left to right, one position at a time, beside a small table of the
  loop variable i and the counter count. The position i advances on every mark, while count
  grows only when a mark is 50 or higher, matching examples/pass_count.py.
captions: vizrec
presets:
  - id: typical
    label: Mixed
    stdin: "3\n45\n50\n68\n"
  - id: none
    label: No matches
    stdin: "3\n10\n20\n30\n"
  - id: all
    label: All match
    stdin: "3\n80\n90\n100\n"
consistency:
  description: The final count equals the output of examples/pass_count.py.
  example: ../examples/pass_count.py
  compare: output
