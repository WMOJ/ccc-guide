layout: single
panels:
  - { id: wheel, viz: LineViz, title: 24-hour clock }
alt: >-
  A 24-position clock wheel with a hand that moves one hour at a time from the starting hour.
  Passing hour 23 wraps the hand back to 0, and a negative offset wraps the other way, so the
  hand always ends at the sum taken modulo 24, matching examples/clock_wrap.py.
captions: vizrec
presets:
  - id: forward
    label: Past midnight
    stdin: "22\n5\n"
  - id: back
    label: Back past 0
    stdin: "2\n-5\n"
  - id: laps
    label: Full laps
    stdin: "5\n50\n"
consistency:
  description: The final hour in the visual equals the output of examples/clock_wrap.py.
  example: ../examples/clock_wrap.py
  compare: output
