layout: single
panels:
  - { id: line, viz: LineViz, title: Day range }
alt: >-
  Counting how many times a periodic event lands within a range of days, by finding how many
  full cycles fit in the span since the first event, then checking whether one more event fits
  in what is left over.
captions: vizrec
presets:
  - id: main
    label: Full cycles
    stdin: "3\n1\n10\n"
  - id: remainder
    label: Plus a remainder
    stdin: "4\n2\n11\n"
  - id: none
    label: Not started yet
    stdin: "10\n50\n5\n"
consistency:
  description: The final count in the visual equals the output of examples/event_count.py.
  example: ../examples/event_count.py
  compare: output
