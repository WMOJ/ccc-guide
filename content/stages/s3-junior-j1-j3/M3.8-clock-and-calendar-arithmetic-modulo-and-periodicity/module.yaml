id: M3.8
title: Clock and calendar arithmetic (modulo and periodicity)
status: accepted
objectives:
  - Use modulo to work with periodic data like hours, days, and weeks.
  - Solve time-addition problems by adding and using modulo.
  - Recognize periodicity in data and apply modulo to reduce it.
  - Use modulo to handle wrap-around (circular) sequences.
prereqs:
  - M1.2
  - M2.3
lessons:
  - clock-and-calendar-arithmetic
practice:
  - id: ccc24s1
    note: Compare values at paired positions around a circular arrangement, wrapping the index with modulo.
  - id: ccc17j4
    note: Count occurrences of a periodic event across a long span, using cycles and a remainder.
    why: A periodicity problem matching this lesson's cycle-and-remainder pattern.
