layout: single
panels:
  - { id: values, viz: ArrayViz, title: Every start and end }
alt: >-
  The brute force for the best stretch. For each pair of a start i and an end j, the slice between
  them is marked on the array with its sum, and the best sum so far is kept in a second mark. The
  last step shows the best stretch and its sum.
captions: vizrec
presets:
  - id: main
    label: Six days
    stdin: "6\n3 -4 2 -1 4 -5\n"
  - id: losses
    label: All losses
    stdin: "3\n-2 -1 -3\n"
  - id: one
    label: One day
    stdin: "1\n5\n"
consistency:
  description: The best sum equals the output of examples/every_pair.py on each preset's input.
  example: ../examples/every_pair.py
  compare: output
