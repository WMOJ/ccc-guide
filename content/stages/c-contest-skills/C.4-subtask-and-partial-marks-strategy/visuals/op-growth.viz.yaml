layout: single
panels:
  - { id: plot, viz: PlotViz, title: Additions as n grows }
alt: >-
  Lines showing how many additions each plan performs as n grows, with a flat dotted line at the
  budget of 10^7 and a vertical mark at the subtask's bound. The slice-sum plan curves up fastest
  and crosses the budget just past 300. The running-sum plan crosses it past 4,000. The
  prefix-and-minimum plan is a straight line that stays far below the budget at 10^6.
captions: vizrec
presets:
  - id: first
    label: N ≤ 300
    stdin: "1\n300\n"
  - id: second
    label: N ≤ 4000
    stdin: "1\n4000\n"
  - id: third
    label: N ≤ 10^6
    stdin: "1\n1000000\n"
consistency:
  description: The counts at the subtask's bound equal the output of examples/count_adds.py on the same bound.
  example: ../examples/count_adds.py
  compare: output
