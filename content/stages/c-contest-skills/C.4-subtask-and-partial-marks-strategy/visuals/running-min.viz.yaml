layout: row
panels:
  - { id: values, viz: ArrayViz, title: values }
  - { id: prefix, viz: ArrayViz, title: prefix }
alt: >-
  The prefix-sum method with a running minimum. The prefix array sits under the values. A marker
  shows low, the smallest prefix entry seen so far, and another shows the end being tried. For
  each end, the best sum ending there is the end entry minus low, and the matching run of values
  is marked. The best sum so far is kept, and low moves whenever a smaller entry appears.
captions: vizrec
presets:
  - id: main
    label: Six days
    stdin: "6\n3 -4 2 -1 4 -5\n"
  - id: losses
    label: All losses
    stdin: "3\n-4 -2 -7\n"
  - id: gains
    label: All gains
    stdin: "4\n1 2 3 4\n"
consistency:
  description: The best sum equals the output of examples/prefix_min.py on each preset's input.
  example: ../examples/prefix_min.py
  compare: output
