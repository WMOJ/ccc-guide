layout: row
panels:
  - { id: tree, viz: TreeViz, title: Tree }
  - { id: stack, viz: StructViz, title: Stack }
alt: >-
  An iterative preorder DFS on a rooted tree. Each pop marks the popped vertex current, then
  pushes its unvisited neighbors onto the stack. The tree colors a vertex the moment it is
  popped and marked visited, matching the stack panel on the right.
captions: vizrec
presets:
  - id: tree
    label: Tree
    stdin: "7 6\n0 1\n0 2\n1 3\n1 4\n2 5\n2 6\n"
consistency:
  description: The final preorder matches the order examples/iterative_dfs_basic.py prints on each preset.
  example: ../examples/iterative_dfs_basic.py
  compare: output
