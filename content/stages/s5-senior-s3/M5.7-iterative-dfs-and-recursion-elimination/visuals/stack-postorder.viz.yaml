layout: row
panels:
  - { id: tree, viz: TreeViz, title: Tree }
  - { id: stack, viz: StructViz, title: Stack }
alt: >-
  An iterative postorder DFS on a rooted tree, using a marker entry on the stack. A vertex
  enters the stack once as itself, with its unvisited children pushed above it, and once as a
  starred marker below them. The marker is only recorded once every child above it has been
  recorded, so a vertex's postorder position always comes after all of its children.
captions: vizrec
presets:
  - id: tree
    label: Tree
    stdin: "7 6\n0 1\n0 2\n1 3\n1 4\n2 5\n2 6\n"
consistency:
  description: The final postorder matches the order examples/iterative_dfs_postorder.py prints on each preset.
  example: ../examples/iterative_dfs_postorder.py
  compare: output
