id: M5.11
status: accepted
objectives:
  - Implement min-heaps and max-heaps using heapq and negation.
  - Detect out-of-date heap entries and skip them by checking a table of current values.
  - Simulate multiset operations with a pending-count dict that removes safely under duplicates.
  - Maintain a sliding-window minimum with a heap, discarding expired entries lazily.
