layout: row
panels:
  - { id: t, viz: TreeViz, title: Heap as a tree }
  - { id: a, viz: ArrayViz, title: Heap list }
alt: >-
  Pushing values into a heap and popping them out again. Each push places a value at the end of
  the list and moves it up past any bigger parent. Each pop removes the root, moves the last item
  into its place, and sifts that item down past any smaller child, always keeping the smallest
  value at the root.
captions: vizrec
presets:
  - id: five
    label: Five items
    stdin: "5\n5 2 8 1 9\n"
  - id: one
    label: One item
    stdin: "1\n4\n"
consistency:
  description: The heap list and the pop order in the visual equal the output of examples/heap_basics.py.
  example: ../examples/heap_basics.py
  compare: output
