id: M5.12
title: O(N^2) DP on intervals and centre expansion
status: accepted
objectives:
  - Recognize interval DP patterns and implement centre-expansion recurrences.
  - Optimize space by keeping only the longest length found at each center instead of a full 2D table.
  - Handle both odd and even-length intervals in expansion.
  - Choose the right recurrence to stay in O(N^2) time on moderately sized inputs.
prereqs:
  - M4.11
lessons:
  - interval-dp-expansion
practice:
  - id: ccc16j3
    note: Find the length of the longest palindrome hidden inside a word.
    why: A DMOJ-era problem whose whole task is exactly this module's centre-expansion technique.
  - id: ccc23s2
    note: Find the least unevenness of a mountain range when it is cropped to different lengths, comparing heights inward from each end.
