id: M5.3
status: accepted
objectives:
  - Maintain letter counts in a fixed-length window in O(1) per step.
  - Track matching windows with a "matches" counter.
  - Implement variable-length windows maintaining distinct elements.
practice:
  - id: ccc20s3
    note: Count the distinct substrings of a longer text that are rearrangements of a shorter one.
    why: A fixed-length window with letter counts, matched through a matches counter, is exactly the technique this lesson builds.
