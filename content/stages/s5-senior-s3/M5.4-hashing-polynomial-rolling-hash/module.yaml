id: M5.4
status: accepted
objectives:
  - Implement polynomial rolling hash with `(h * B + c) % M`.
  - Remove the leading character using precomputed powers.
  - Detect hash collisions and use double hashing or a large modulus.
  - Use rolling hashes to count distinct substrings.
practice:
  - id: ccc20s3
    note: Count the distinct substrings of a longer text that are rearrangements of a shorter one.
    why: Telling distinct substrings apart without comparing them letter by letter is what a rolling hash is for.
