layout: row
panels:
  - { id: correct, viz: ArrayViz, title: "hi = mid" }
  - { id: broken, viz: ArrayViz, title: "hi = mid - 1" }
alt: >-
  The same capacity search run twice, side by side, on the same three packages. Both searches
  check the same two candidates, 8 then 6, and agree that both are feasible. The correct panel
  updates hi to mid each time and lands on 6, the true smallest feasible capacity. The broken
  panel updates hi to mid minus one instead, discards 6, and lands on 5, a capacity that fails
  its own feasibility check.
captions: vizrec
presets:
  - id: compare
    label: Compare
    stdin: "3 2\n5 4 2\n"
consistency:
  description: The correct panel's final lo equals the output of examples/capacity_search.py for the same input.
  example: ../examples/capacity_search.py
  compare: output
