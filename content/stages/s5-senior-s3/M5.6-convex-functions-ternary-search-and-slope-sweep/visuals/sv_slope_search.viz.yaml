layout: single
panels:
  - { id: plot, viz: PlotViz, title: Slope binary search }
alt: >-
  The same convex cost curve, searched by comparing cost at mid and mid plus one instead of two
  interior thirds. The band of still-searched locations halves every round. A second preset has
  a completely flat plateau between two equally weighted sites, where every comparison inside the
  plateau reads as flat or rising, and the search still converges to a genuine minimizer.
captions: vizrec
presets:
  - id: four_points
    label: Four sites
    stdin: "4\n10 40 50 100\n1 2 1 3\n10 100\n"
  - id: plateau
    label: Flat plateau
    stdin: "2\n10 90\n1 1\n0 150\n"
consistency:
  description: The final location and cost equal the output of examples/slope_search.py for the same input.
  example: ../examples/slope_search.py
  compare: output
