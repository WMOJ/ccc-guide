layout: single
panels:
  - { id: plot, viz: PlotViz, title: Ternary search }
alt: >-
  A convex cost curve over candidate locations. Two interior points m1 and m2 are compared each
  round, and the shaded band of still-searched locations shrinks toward the minimum. A second
  preset has two equally weighted job sites, whose cost curve is flat across the whole segment
  between them, and the search still lands on a valid minimizer at one end of that flat stretch.
captions: vizrec
presets:
  - id: four_points
    label: Four sites
    stdin: "4\n10 40 50 100\n1 2 1 3\n10 100\n"
  - id: plateau
    label: Flat plateau
    stdin: "2\n10 90\n1 1\n0 150\n"
consistency:
  description: The final location and cost equal the output of examples/ternary_search.py for the same input.
  example: ../examples/ternary_search.py
  compare: output
