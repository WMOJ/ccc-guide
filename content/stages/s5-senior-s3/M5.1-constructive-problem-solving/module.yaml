id: M5.1
title: Constructive problem solving
status: accepted
objectives:
  - Build any valid witness instead of testing all possibilities.
  - Start from simple patterns and handle extreme cases.
  - Use symmetry and invariants to constrain the search.
  - Verify output before submitting a solution.
prereqs:
  - M2.5
  - M2.6
  - M4.5
lessons:
  - constructive-building
practice:
  - id: ccc23s3
    note: Build a palindromic poster on a grid by choosing characters for each cell.
  - id: ccc19s3
    note: Fill a grid so all rows and columns have the same sum.
    why: An older constructive-casework problem with the same build-and-verify approach.
