id: M5.10
title: Disjoint Set Union (union-find)
status: accepted
objectives:
  - Implement find with path halving to track connectivity across components.
  - Apply union by size to keep the tree shallow and fast.
  - Use the "next free slot" DSU trick to solve resource allocation problems.
  - Recognize when DSU contracts components for efficient solutions.
prereqs:
  - M1.8
  - M1.10
lessons:
  - union-find-connectivity
practice:
  - id: ccc15s3
    note: Find the next available gate on a linear arrangement using DSU next-free optimization.
    why: A direct application of the next-free-slot trick from this module.
  - id: ccc17s4
    note: Merge components with DSU while breaking ties between equally cheap connections.
    why: The full problem builds a minimum spanning tree, a later module's topic, but its DSU merging step is good practice here.
