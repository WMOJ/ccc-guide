layout: row
panels:
  - { id: g, viz: GraphViz, title: Forest }
  - { id: p, viz: ArrayViz, title: parent }
alt: >-
  Five elements start as five single-node trees. Each union compares the size of the two roots
  and attaches the smaller tree under the larger one, so the tree stays flat as it grows. A
  repeated union between elements already in the same group leaves the forest unchanged.
captions: vizrec
presets:
  - id: sizes
    label: Five elements
    stdin: "5 3\n0 1\n2 3\n0 2\n"
  - id: uneven
    label: Repeat
    stdin: "6 6\n0 1\n0 2\n3 4\n0 3\n5 0\n0 1\n"
consistency:
  description: The parent array and sizes in the visual equal the output of examples/dsu_union.py.
  example: ../examples/dsu_union.py
  compare: output
