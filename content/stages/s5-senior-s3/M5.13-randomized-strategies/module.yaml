id: M5.13
title: Randomized strategies
status: accepted
objectives:
  - Use a random shuffle and random pivot choices to find an answer or avoid a worst-case input.
  - Calculate the probability of failure and choose enough trials.
  - Use a fixed random seed for reproducibility in testing and debugging.
  - Reason about when randomization is fast enough for a given time limit.
prereqs:
  - M1.13
  - M4.6
lessons:
  - randomized-strategies
practice:
  - id: ccc26s3
    note: Choose two separate groups of cards whose totals share a common factor.
