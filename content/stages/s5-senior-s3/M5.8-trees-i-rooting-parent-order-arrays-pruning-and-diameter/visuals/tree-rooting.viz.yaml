layout: row
panels:
  - { id: t, viz: TreeViz, title: Rooms }
  - { id: arr, viz: TableViz, title: "Parent, depth, order" }
alt: >-
  A small floor plan of rooms, rooted with an iterative BFS from the security desk. Each room
  joins the queue the first time a discovered neighbor reaches it, recording its parent and
  depth. A table below the tree fills in the same parent, depth and order values as the BFS
  runs. The second preset extends one branch further, showing the same rooms keep the same
  parents once a hallway wing is added beyond them.
captions: vizrec
presets:
  - id: office
    label: Six rooms
    stdin: "6 0\n0 1\n0 2\n1 3\n1 4\n2 5\n"
  - id: wing
    label: Extra wing
    stdin: "7 0\n0 1\n0 2\n1 3\n1 4\n2 5\n3 6\n"
consistency:
  description: The final parent, depth and order match the output of examples/tree_rooting.py on each preset.
  example: ../examples/tree_rooting.py
  compare: output
