layout: row
panels:
  - { id: t, viz: GraphViz, title: Floor plan }
  - { id: q, viz: StructViz, title: Queue }
alt: >-
  A floor plan pruned down to its meeting rooms. Every dead-end room that is not a meeting room
  joins a queue and closes; closing a room can drop a neighbor's degree to 1, which queues that
  neighbor too, so the closures move inward one layer at a time. Meeting rooms are never queued,
  however low their degree falls, so the corridors leading to them always survive.
captions: vizrec
legendLabels:
  path: Meeting room
  invalid: Closed
presets:
  - id: office
    label: Two wings
    stdin: "8 2\n2 5\n0 1\n1 2\n0 3\n3 4\n4 5\n0 6\n6 7\n"
  - id: all-important
    label: All meeting rooms
    stdin: "6 3\n3 4 5\n0 1\n0 2\n1 3\n1 4\n2 5\n"
  - id: one-hub
    label: One meeting room
    stdin: "5 1\n0\n0 1\n0 2\n0 3\n0 4\n"
consistency:
  description: The kept rooms and closed-hallway count equal the output of examples/tree_pruning.py on each preset.
  example: ../examples/tree_pruning.py
  compare: output
