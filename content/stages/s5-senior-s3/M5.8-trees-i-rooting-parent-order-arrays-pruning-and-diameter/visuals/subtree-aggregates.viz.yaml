layout: row
panels:
  - { id: t, viz: TreeViz, title: Rooms }
  - { id: arr, viz: TableViz, title: "Size, total" }
alt: >-
  A rooted floor plan folding subtree totals up from the leaves. Walking the BFS order backward,
  each room adds its own size and item total into its parent's, so a parent only finishes once
  every room beneath it already has. The second preset adds one more room two levels down, so its
  count has to pass through a middle room before it reaches the root.
captions: vizrec
presets:
  - id: office
    label: Six rooms
    stdin: "6 0\n0 1\n0 2\n1 3\n1 4\n2 5\n2 1 3 0 4 1\n"
  - id: wing
    label: Extra wing
    stdin: "7 0\n0 1\n0 2\n1 3\n1 4\n2 5\n4 6\n2 1 3 0 4 1 2\n"
consistency:
  description: The final size and total rows equal the output of examples/tree_aggregates.py on each preset.
  example: ../examples/tree_aggregates.py
  compare: output
