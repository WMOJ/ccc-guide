id: M5.8
status: accepted
objectives:
  - Distinguish trees from general graphs and identify their properties.
  - Root a tree at a node and compute parent and depth arrays.
  - Build order arrays and perform tree traversals.
  - Compute tree diameter using two BFS passes.
  - Prune leaves iteratively and compute subtree aggregates.
practice:
  - id: ccc16s3
    note: Visit every highly rated restaurant in a city whose roads form a tree, in as little travel time as possible.
    why: A tree problem old enough to need DMOJ, and a direct fit for this module's rooting and leaf-pruning techniques.
