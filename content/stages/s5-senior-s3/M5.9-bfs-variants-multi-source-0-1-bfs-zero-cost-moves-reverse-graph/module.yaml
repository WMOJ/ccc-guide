id: M5.9
status: accepted
objectives:
  - Implement multi-source BFS starting from several nodes at once.
  - Use 0-1 BFS with deque to handle graphs with edge weights 0 and 1.
  - Detect and process forced zero-cost moves (conveyors) with cycle detection.
  - Apply reverse-graph BFS to find distances backward from a target.
practice:
  - id: ccc18s3
    note: Guide a robot past security cameras and conveyor belts to escape a factory floor.
    why: The factory's forced conveyor belts need the same cycle-safe handling this lesson builds.
  - id: ccc21s4
    note: Find the fastest trip after each change to the order of stops on a subway line, with one-way walkways as another way to travel.
