id: M6.4
title: DFS tree properties and edge classification
status: accepted
objectives:
  - Classify edges in a DFS tree as tree, back, forward, and cross edges.
  - Compute discovery and finish times for each node.
  - Use DFS timing to detect cycles and perform topological sorting.
  - Apply DFS tree structure to solve graph connectivity problems.
prereqs:
  - M5.7
lessons:
  - dfs-tree
practice:
  - id: ccc21s4
    note: Find all nodes in a single strongly connected component without visiting others.
  - id: ccc16s4
    note: Determine whether a directed graph has a cycle.
