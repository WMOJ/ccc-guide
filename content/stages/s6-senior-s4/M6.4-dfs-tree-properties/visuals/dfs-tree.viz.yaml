layout: row
panels:
  - { id: tree, viz: TreeViz, title: DFS tree }
  - { id: t, viz: TableViz, title: Edges by interval }
legendLabels:
  done: Finished
  path: Tree edge
  invalid: Back edge
  compare: Forward edge
  frontier: Cross edge
alt: >-
  The DFS tree of a small directed graph, each node annotated with its discovery and finish times,
  beside a table listing every edge with the intervals of its two ends and its kind. Tree and
  forward edges end inside the interval they start in, back edges end at an interval that contains
  the start, and cross edges end at an interval that closed before the start opened.
captions: vizrec
presets:
  - id: four-kinds
    label: Four kinds
    stdin: "5 7\n0 1\n1 2\n2 3\n3 1\n0 3\n0 4\n4 2\n"
consistency:
  description: The edge kinds and times equal the output of examples/edge_kinds.py.
  example: ../examples/edge_kinds.py
  compare: output
