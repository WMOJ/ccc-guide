layout: row
panels:
  - { id: g, viz: GraphViz, title: Tasks }
  - { id: a, viz: ArrayViz, title: Order }
legendLabels:
  current: On the stack
  done: Finished
  path: Tree edge
  invalid: Back edge
alt: >-
  A depth-first search over a directed graph of tasks. Each node joins a row when it finishes, after
  every task that depends on it. When the search ends without a back edge, the row read from right
  to left is a valid order; a back edge means a cycle and no order exists.
captions: vizrec
presets:
  - id: dag
    label: Six tasks
    stdin: "6 7\n0 1\n0 2\n1 3\n2 3\n3 4\n2 5\n5 4\n"
  - id: chain
    label: Backward chain
    stdin: "4 3\n3 2\n2 1\n1 0\n"
  - id: cycle
    label: A cycle
    stdin: "4 4\n0 1\n1 2\n2 3\n3 1\n"
consistency:
  description: The final order (or the word cycle) equals the output of examples/topo_order.py.
  example: ../examples/topo_order.py
  compare: output
