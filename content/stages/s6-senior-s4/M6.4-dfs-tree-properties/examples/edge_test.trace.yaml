example: edge_test.py
alt: >-
  The program reads several edge checks. Each gives the discovery and finish times of the edge's two
  ends at the moment the search tries it, with -1 meaning no time yet. It prints tree when the far
  end has no discovery time, back when it has one but no finish time, forward when it is finished
  and was discovered later than the near end, and cross otherwise.
presets:
  - id: four
    label: Four kinds
    stdin: "4\n0 -1 -1 -1\n3 -1 1 -1\n0 -1 3 4\n7 -1 2 5"
  - id: back
    label: One check
    stdin: "1\n3 -1 1 -1"
skip:
  - { line: 8, keep: 1, to: 13, label: "Reading the four times of the next check is skipped." }
notes:
  "13": "`dv` is -1: the far end has no discovery time yet, so this edge is a tree edge."
  "15": "The far end was discovered but has no finish time: it is still on the stack, an ancestor. A back edge."
  "17": "The far end is finished. It was discovered after the near end, so it is a descendant reached another way: forward."
  "20": "The far end is finished and was discovered before the near end, in a branch that closed earlier: cross."
