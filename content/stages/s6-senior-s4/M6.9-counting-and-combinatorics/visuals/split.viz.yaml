layout: single
panels:
  - { id: t, viz: TableViz }
alt: >-
  Splitting labeled items into groups of fixed sizes, one group at a time. For each group the
  table shows its size, how many items are left to choose from, the binomial coefficient for
  choosing that group, and the running product of those coefficients.
captions: vizrec
presets:
  - id: three
    label: Sizes 3, 4, 3
    stdin: "3\n3 4 3\n"
  - id: equal
    label: Sizes 2, 2, 2
    stdin: "3\n2 2 2\n"
  - id: one
    label: One group
    stdin: "1\n5\n"
consistency:
  description: The final product equals the output of examples/split_groups.py.
  example: ../examples/split_groups.py
  compare: output
