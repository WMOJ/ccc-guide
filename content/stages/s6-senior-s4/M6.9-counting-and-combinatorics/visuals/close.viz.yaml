layout: single
panels:
  - { id: a, viz: ArrayViz, title: Sorted heights }
alt: >-
  Counting pairs of sorted heights that differ by at most a limit. A right pointer sweeps
  forward; the left pointer only moves forward when the gap between the two heights is too large.
  Every position from left up to just before right is a partner for the height at right, and
  the count grows by that many.
captions: vizrec
legendLabels:
  frontier: Partner
  current: At right
  done: Left behind
presets:
  - id: spread
    label: Spread out
    stdin: "8 4\n1 3 4 8 9 10 14 15\n"
  - id: zero
    label: Limit zero
    stdin: "6 0\n5 2 9 2 5 2\n"
  - id: close
    label: All close
    stdin: "5 100\n7 3 9 1 5\n"
consistency:
  description: The count equals the output of examples/close_pairs.py.
  example: ../examples/close_pairs.py
  compare: output
