id: M6.9
status: accepted
objectives:
  - Count groups of equal items with a frequency table instead of listing every pair.
  - Use binomial coefficients and products of counts to count selections and splits.
  - Apply complementary counting to count the opposite case and subtract it from the total.
  - Maintain a count with two pointers over a sorted array as a range constraint slides forward.
practice:
  - id: ccc22s4
    note: Count the triples of points on a circle whose triangle contains the center.
  - id: ccc17j5
    note: Join pieces of wood in pairs into boards, then count the boards of each length.
    why: Pairs of pieces are counted by the length they add up to, a counting problem over groups of equal totals.
