layout: row
panels:
  - { id: arr, viz: ArrayViz, title: Piles }
  - { id: tab, viz: TableViz, title: "dp[i][j]" }
alt: >-
  Filling the dp table for merging a row of piles, shortest intervals first. The diagonal starts
  at 0. Each longer cell tries every split k, takes the smallest total, and draws arrows back to
  the two shorter cells it was built from, while the piles array shows the chosen left and right
  blocks.
captions: vizrec
legendLabels:
  compare: Used by current cell
presets:
  - id: four
    label: Four piles
    stdin: "4\n2 3 5 7\n"
  - id: five
    label: Five piles
    stdin: "5\n4 1 3 2 6\n"
  - id: equal
    label: Equal piles
    stdin: "4\n3 3 3 3\n"
consistency:
  description: The bottom-right answer cell equals the minimum cost printed by examples/merge_cost.py on each preset.
  example: ../examples/merge_cost.py
  compare: output
