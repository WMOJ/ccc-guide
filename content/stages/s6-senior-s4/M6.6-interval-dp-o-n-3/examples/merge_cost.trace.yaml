example: merge_cost.py
alt: >-
  The program reads the pile sizes, builds prefix sums, then fills dp by interval size. For each
  interval i to j it tries every split k, keeps the smallest dp[i][k] plus dp[k+1][j], and adds the
  range sum from the prefix array.
presets:
  - id: main
    label: Three piles
    stdin: "3\n2 3 5\n"
  - id: two
    label: Two piles
    stdin: "2\n4 6\n"
  - id: single
    label: One pile
    stdin: "1\n7\n"
skip:
  - { line: 25, keep: 1, to: 28, label: "The rest of the running sums in pre are added the same way as in the prefix sums lesson." }
notes:
  "10": "`best` keeps the smallest total seen so far for this interval, over every split k tried."
  "12": "The last merge joins the two blocks, so it always costs the whole range sum `span`, whatever k was chosen."
