layout: row
panels:
  - { id: line, viz: LineViz, title: Intervals and the sweep }
  - { id: events, viz: TableViz, title: Sorted events }
alt: >-
  A number line with a few intervals drawn on separate rows, above a table of their sorted start
  and end events. A sweep marker moves left to right one event at a time; after each event the
  table fills in the active count and the covered length so far, and the intervals turn from
  waiting to active to finished.
captions: vizrec
presets:
  - id: gap
    label: With a gap
    stdin: "3\n0 4\n2 6\n8 10\n"
  - id: nested
    label: Nested
    stdin: "3\n0 10\n2 4\n5 7\n"
  - id: touching
    label: Touching
    stdin: "2\n0 4\n4 8\n"
consistency:
  description: The covered length and the largest active count equal what examples/sweep_line_coverage.py prints.
  example: ../examples/sweep_line_coverage.py
  compare: output
