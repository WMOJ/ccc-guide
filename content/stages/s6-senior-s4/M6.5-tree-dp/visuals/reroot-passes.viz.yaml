layout: row
panels:
  - { id: t, viz: TreeViz, title: Nodes }
  - { id: arr, viz: TableViz, title: "Two passes" }
alt: >-
  Rerooting on a rooted tree in two passes. The first pass walks the BFS order backward and fills
  each node's subtree size and the sum of distances down to its descendants. The second pass walks
  the order forward: each child's answer is its parent's answer minus its subtree size plus the
  number of nodes outside its subtree.
captions: vizrec
presets:
  - id: main
    label: Six nodes
    stdin: "6\n0 1\n0 2\n1 3\n1 4\n2 5\n"
  - id: chain
    label: Chain
    stdin: "5\n0 1\n1 2\n2 3\n3 4\n"
  - id: star
    label: Off-center star
    stdin: "5\n0 1\n1 2\n1 3\n1 4\n"
consistency:
  description: The final size, down and ans rows equal the output of examples/tree_reroot.py on each preset.
  example: ../examples/tree_reroot.py
  compare: output
