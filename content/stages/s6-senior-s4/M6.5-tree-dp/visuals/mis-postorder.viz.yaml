layout: row
panels:
  - { id: t, viz: TreeViz, title: "Nodes (dp0/dp1)" }
  - { id: arr, viz: TableViz, title: "dp values" }
alt: >-
  A rooted tree where every node carries two counts: the largest independent set in its subtree
  with the node left out (dp0) and with the node chosen (dp1). Walking the BFS order backward, each
  finished node folds its counts into its parent, so a parent is final once its last child has
  folded in. The root's larger count is the answer.
captions: vizrec
presets:
  - id: main
    label: Six nodes
    stdin: "6\n0 1\n0 2\n1 3\n1 4\n2 5\n"
  - id: chain
    label: Chain
    stdin: "5\n0 1\n1 2\n2 3\n3 4\n"
  - id: star
    label: Star
    stdin: "5\n0 1\n0 2\n0 3\n0 4\n"
consistency:
  description: The final dp0, dp1 and answer equal the output of examples/tree_mis.py on each preset.
  example: ../examples/tree_mis.py
  compare: output
