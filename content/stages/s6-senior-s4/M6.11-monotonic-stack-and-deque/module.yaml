id: M6.11
title: Monotonic stack and deque
status: accepted
objectives:
  - Use a monotonic stack to find the next greater element in linear time.
  - Track the maximum in a sliding window with a monotonic deque.
  - Reuse the same sliding-window deque to answer a feasibility check over a shrinking range.
  - Solve classic window-maximum problems in linear time.
prereqs:
  - M4.8
  - M5.3
lessons:
  - monotonic-structures
practice:
  - id: ccc19s4
    note: Plan a multi-day itinerary that visits the most cities under a travel budget.
    why: An older windowed-search problem that still makes good practice for this module.
  - id: ccc26s4
    note: Track which minecarts can still reach the end of the line as tracks change.
