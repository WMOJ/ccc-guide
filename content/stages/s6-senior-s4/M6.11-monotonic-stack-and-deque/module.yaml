id: M6.11
status: accepted
objectives:
  - Use a monotonic stack to find the next greater element in linear time.
  - Track the maximum in a sliding window with a monotonic deque.
  - Use a monotonic stack to find how far each bar can stretch, sizing the largest rectangle in a histogram.
  - Explain why the total work is linear, because each index is pushed once and popped at most once.
