layout: single
panels:
  - { id: t, viz: TableViz, title: "Does d divide i?" }
alt: >-
  A grid with one row for each d and one column for each i, marked where d divides i. Filling the
  rows from d = 1 down adds the multiples of each d, and the total number of marks is both the sum of
  n divided by d and the sum of the divisor counts of every i.
captions: vizrec
presets:
  - id: six
    label: n = 6
    stdin: "6\n"
  - id: four
    label: n = 4
    stdin: "4\n"
  - id: one
    label: n = 1
    stdin: "1\n"
consistency:
  description: The two totals in the visual equal the output of examples/divisor_count.py.
  example: ../examples/divisor_count.py
  compare: output
