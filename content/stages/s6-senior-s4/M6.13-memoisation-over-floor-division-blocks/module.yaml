id: M6.13
title: Memoisation over floor-division blocks
status: accepted
objectives:
  - Recognize when floor division creates a limited set of distinct quotients.
  - Apply memoisation to avoid recomputation over ranges with the same quotient.
  - Optimize range queries using floor-division blocks.
prereqs:
  - M4.11
  - M4.6
lessons:
  - floor-division-blocks
practice:
  - id: ccc20s1
    note: Find divisor counts over a range using precomputed factorization.
  - id: ccc21s1
    note: Compute sums involving floor division efficiently over large ranges.
