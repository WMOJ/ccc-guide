id: M6.13
title: Memoisation over floor-division blocks
status: accepted
objectives:
  - Recognize when a sum over floor division takes only O(sqrt(n)) distinct values.
  - Jump between block boundaries instead of scanning every divisor.
  - Apply floor-division blocks to divisor-counting sums.
prereqs:
  - M4.11
  - M4.6
lessons:
  - floor-division-blocks
practice:
  - id: ccc20s1
    note: Work with a sprinter's recorded checkpoint times to find a consistent picture of the race.
    why: An older problem whose numeric structure still makes good practice for this module.
  - id: ccc21s1
    note: Cut a fence into pieces while respecting a length-based rule.
