id: M6.12
status: accepted
objectives:
  - Build a doubling table where each entry is the jump before it, applied twice.
  - Answer a "where do I land after K jumps" query by combining one table entry per set bit of K.
  - Explain why the table costs O(n log K) to build, each query O(log K), and why the order of the hops does not matter.
practice:
  - id: ccc16s5
    note: Find the state of a ring of cells after an enormous number of generations.
    why: The same update rule is applied to a ring of cells up to 10^15 times.
