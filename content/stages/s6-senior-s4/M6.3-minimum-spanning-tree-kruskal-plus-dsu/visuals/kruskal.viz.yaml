layout: row
panels:
  - { id: g, viz: GraphViz, title: Cities }
  - { id: p, viz: ArrayViz, title: parent }
alt: >-
  Kruskal's algorithm on a small weighted graph. Edges are examined cheapest first: an edge
  joining two different groups is accepted and drawn thick, and the DSU parent array and the group
  root under each city update; an edge inside one group is skipped. When the groups never merge
  into one, no spanning tree exists.
captions: vizrec
presets:
  - id: main
    label: Six cities
    stdin: "6 8\n0 1 5\n0 2 8\n0 3 6\n1 2 3\n1 4 7\n2 3 4\n3 4 2\n3 5 9\n"
  - id: ties
    label: Equal costs
    stdin: "5 5\n0 1 4\n0 2 1\n0 3 4\n1 4 4\n3 4 4\n"
  - id: apart
    label: Two groups
    stdin: "6 6\n0 1 5\n0 2 8\n1 2 3\n3 4 2\n3 5 9\n4 5 6\n"
consistency:
  description: The total cost and the accepted edges in the visual equal the output of examples/kruskal_mst.py.
  example: ../examples/kruskal_mst.py
  compare: output
