layout: single
panels:
  - { id: g, viz: GraphViz, title: Cities }
alt: >-
  The partly built tree with one skipped edge at a time. The skipped edge is marked, and the path
  of accepted edges that already joins its two ends is highlighted, showing that every edge on
  that path costs no more than the skipped one.
captions: vizrec
legendLabels:
  done: Accepted edge
  path: Path joining the ends
  invalid: Skipped edge
  compare: End of the skipped edge
presets:
  - id: main
    label: Six cities
    stdin: "6 8\n0 1 5\n0 2 8\n0 3 6\n1 2 3\n1 4 7\n2 3 4\n3 4 2\n3 5 9\n"
  - id: apart
    label: Two groups
    stdin: "6 6\n0 1 5\n0 2 8\n1 2 3\n3 4 2\n3 5 9\n4 5 6\n"
consistency:
  description: The total cost and the accepted edges in the visual equal the output of examples/kruskal_mst.py.
  example: ../examples/kruskal_mst.py
  compare: output
