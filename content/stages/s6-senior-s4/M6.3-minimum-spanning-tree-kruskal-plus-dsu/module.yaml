id: M6.3
title: Minimum spanning tree and Kruskal with DSU
status: accepted
objectives:
  - Recognize when a minimum spanning tree solves a connectivity or infrastructure problem.
  - Implement Kruskal's algorithm sorting edges by weight.
  - Use a disjoint-set union (DSU) data structure to check connectivity and union components.
  - Optimize DSU with path compression and union by rank.
prereqs:
  - M5.10
  - M4.2
lessons:
  - kruskal-mst
practice:
  - id: ccc17s4
    note: Build a minimum spanning tree while preferring to keep certain edges when costs tie.
    why: An older MST problem, with a DSU-based tie-breaking rule, that still makes good practice for this module.
  - id: ccc23s4
    note: A subtask of this problem reduces to a plain minimum spanning tree.
