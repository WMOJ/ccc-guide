id: M7.12
title: Python constant-factor engineering at scale
status: accepted
objectives:
  - Identify performance bottlenecks in Python programs that run on PyPy.
  - Use flat 1D lists and parallel lists instead of tuples and dictionaries.
  - Encode integers into single values to reduce memory and cache misses.
  - Read input in one call, join output, and measure on maximum-size test cases.
  - Know when further optimisation returns diminishing marks and when to stop.
prereqs:
  - M2.9
  - M3.10
  - M5.7
lessons:
  - constant-factor-engineering
practice:
  - id: ccc19s4
    note: Find the minimum cost to process a stream of updates to a flat array.
  - id: ccc15s5
    note: Compute the shortest meeting time for scheduled intervals.
    why: An older problem that builds timing-critical fast-I/O and loop skills.
