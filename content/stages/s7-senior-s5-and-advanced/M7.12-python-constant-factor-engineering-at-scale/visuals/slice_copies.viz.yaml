layout: row
panels:
  - { id: s, viz: ArrayViz, title: "rest = rest[1:]" }
  - { id: i, viz: ArrayViz, title: Index i }
alt: >-
  Two ways to consume a list from the front. With slicing, each pass takes the first item and
  builds a new list of the remaining items, copying them. With an index, the list stays where it
  is and the index moves one place right. The captions keep a running count of items copied by
  slicing, which adds up to n(n-1)/2, while the index version copies nothing.
legendLabels:
  compare: Copied
captions: vizrec
presets:
  - id: five
    label: Five values
    stdin: "5\n4 2 7 1 3\n"
  - id: single
    label: One value
    stdin: "1\n9\n"
consistency:
  description: The total and the number of items copied equal what examples/avoid_copies.py prints.
  example: ../examples/avoid_copies.py
  compare: output
