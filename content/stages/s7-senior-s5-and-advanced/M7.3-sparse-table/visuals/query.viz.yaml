layout: single
panels:
  - { id: array, viz: ArrayViz, title: Array }
alt: >-
  An array with a query range marked. The range is covered by two blocks whose length is the
  largest power of two that fits: one starting at the left end and one ending at the right end.
  Cells in both blocks are marked as shared, and the answer is the smaller of the two block
  minimums.
legendLabels:
  frontier: In the range
  done: In one block
  compare: In both blocks
captions: vizrec
presets:
  - id: main
    label: Length 5
    stdin: "8\n5 3 7 4 6 2 8 3\n1\n1 5\n"
  - id: power
    label: Length 4
    stdin: "8\n5 3 7 4 6 2 8 3\n1\n0 3\n"
  - id: single
    label: One element
    stdin: "8\n5 3 7 4 6 2 8 3\n1\n2 2\n"
consistency:
  description: The answer equals the output of examples/sparse_table.py for the same single query.
  example: ../examples/sparse_table.py
  compare: output
