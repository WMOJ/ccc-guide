id: M7.6
status: accepted
objectives:
  - Compute a power modulo m by repeated squaring, and divide modulo a prime with a modular inverse.
  - Keep repeated fraction updates exact by storing an integer numerator over a fixed denominator.
  - Find where an iterated map starts repeating, and use the cycle to answer a query about a huge step count.
  - Use the lcm and gcd of two periods to bound a search.
practice:
  - id: ccc23s5
    note: Decide which fractions with a given denominator survive a filter that is applied again and again to the unit interval.
