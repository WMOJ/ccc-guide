id: M7.9
status: accepted
objectives:
  - Cut an array into blocks of about the square root of its length and store one summary per block.
  - Answer a range query from two partial blocks and the whole blocks between them.
  - Apply a point update by fixing one value and one block summary.
  - Choose the block size by balancing the two costs, and recompute the summary when it cannot be subtracted.
practice:
  - id: ccc17s5
    note: Answer passenger totals over ranges of stations while trains move along their lines.
    why: Totals over a range of stations are asked while single stations change, the shape of a long row with block totals kept beside it.
