id: M7.4
title: Exchange arguments, scheduling and greedy proofs
status: accepted
objectives:
  - Use exchange arguments to prove a greedy algorithm is optimal.
  - Apply scheduling strategies to interval and deadline problems.
  - Recognize when greedy choices are locally optimal and globally sound.
prereqs:
  - M4.2
  - M2.2
lessons:
  - exchange-arguments
practice:
  - id: ccc15s2
    note: Hand out jerseys of different sizes to as many athletes as possible, given each athlete's size request.
    why: Matching requests to supplies where the order of assignment decides the count is the kind of choice an exchange argument settles.
  - id: ccc15s3
    note: Dock as many arriving planes as possible at an airport's numbered gates.
    why: Each plane must take a gate at or below its limit, and the order in which gates are given out decides how many planes fit.
