layout: single
panels:
  - { id: g, viz: GridViz, title: Grid and window }
legendLabels:
  current: Window being summed
  done: Best window so far
alt: >-
  A grid of positive and negative numbers with a square window that visits every position. For
  each window the caption shows the four prefix-table reads and the sum they give. The best
  window so far stays marked, and the last step marks the best window.
captions: vizrec
presets:
  - id: five
    label: 5 by 5
    stdin: "5 2\n1 -2 3 0 4\n2 5 -1 6 -3\n0 4 7 -2 1\n-1 3 2 8 -4\n5 -3 0 1 2\n"
  - id: whole
    label: Whole grid
    stdin: "3 3\n1 2 3\n4 5 6\n7 8 9\n"
  - id: negative
    label: All negative
    stdin: "4 2\n-5 -2 -8 -1\n-3 -9 -4 -6\n-7 -1 -2 -5\n-4 -6 -3 -8\n"
consistency:
  description: The best sum and its corner equal the two lines examples/rect_sum_max.py prints.
  example: ../examples/rect_sum_max.py
  compare: output
