layout: single
panels:
  - { id: tree, viz: TreeViz, title: Path between two nodes }
alt: >-
  A rooted tree with depths. Two nodes are chosen, their lowest common ancestor is marked, and the
  path from the first node up to the ancestor and down to the second node is highlighted in two
  parts. The caption adds the two parts and shows that the total equals depth of a plus depth of b
  minus twice the depth of the ancestor.
legendLabels:
  frontier: Query node
  current: Lowest common ancestor
  path: Edges from a
  compare: Edges to b
captions: vizrec
presets:
  - id: main
    label: Fork
    stdin: "9\n0 1\n1 2\n2 3\n2 4\n3 5\n4 6\n5 7\n6 8\n1\n7 8\n"
  - id: ancestor
    label: Ancestor
    stdin: "9\n0 1\n1 2\n2 3\n2 4\n3 5\n4 6\n5 7\n6 8\n1\n8 1\n"
  - id: near
    label: Siblings
    stdin: "9\n0 1\n1 2\n2 3\n2 4\n3 5\n4 6\n5 7\n6 8\n1\n3 4\n"
consistency:
  description: The lowest common ancestor and distance equal what examples/lca_query.py prints for the same single query.
  example: ../examples/lca_query.py
  compare: output
