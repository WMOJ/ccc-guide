layout: row
panels:
  - { id: tree, viz: TreeViz, title: Tree with depths }
  - { id: table, viz: TableViz, title: Ancestor table }
alt: >-
  A rooted tree with depths beside a table of ancestors, one row per node and one column per level
  k. Level 0 is each node's parent, with the root's parent being the root. Every later cell is
  filled from two cells of the column to its left, and the tree marks the node being filled, the
  node halfway up, and the node the jump lands on.
legendLabels:
  current: Node being filled
  compare: Halfway node
  path: Lands on
captions: vizrec
presets:
  - id: main
    label: Fork
    stdin: "9\n0 1\n1 2\n2 3\n2 4\n3 5\n4 6\n5 7\n6 8\n"
  - id: short
    label: Short tree
    stdin: "5\n0 1\n0 2\n2 3\n2 4\n"
consistency:
  description: The finished table equals the depth and up rows that examples/lca_table.py prints.
  example: ../examples/lca_table.py
  compare: output
