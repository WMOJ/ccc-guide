layout: single
panels:
  - { id: t, viz: TreeViz, title: "Sum and tag (#i +tag)" }
alt: >-
  A range-sum query after some range updates, on a six-value lazy tree. The query descends from
  the root. A node partly inside the range first pushes its pending tag to its two children,
  adding the tag times the child's length to each child's sum, so that the children can be
  trusted. Nodes outside return zero and nodes inside return their sum. The presets show two
  updates stacked on one node, a pending tag the query never touches, and a tag pushed through two levels.
captions: vizrec
legendLabels:
  current: Inside, sum read
  compare: Partly inside
  invalid: Outside the range
  path: Received pushed tag
presets:
  - id: nested
    label: Stacked tags
    stdin: "6\n2 4 1 3 5 2\n3\n1 1 5 5\n1 2 4 3\n2 3 4\n"
  - id: clean
    label: Off the path
    stdin: "6\n2 4 1 3 5 2\n2\n1 1 5 5\n2 0 1\n"
  - id: cascade
    label: Two levels
    stdin: "6\n2 4 1 3 5 2\n2\n1 0 4 2\n2 0 1\n"
consistency:
  description: The answers printed by examples/lazy_tree.py on each preset's operations equal the query answers the visual computes.
  example: ../examples/lazy_tree.py
  compare: output
