layout: single
panels:
  - { id: v, viz: TableViz, title: "Range from 1 to size - 2" }
alt: >-
  A table comparing two ways to add to every position of a range that nearly fills the array, for
  array sizes 8, 64, 1,024 and 262,144. Writing each leaf costs as many writes as the range has
  positions, which grows with the array. Tagging the covering nodes costs 4, 12, 20 and 28 nodes,
  which grows by 8 each time the size is multiplied by 16.
captions: vizrec
presets:
  - id: sizes
    label: Four sizes
    stdin: "8 128 2048 32768\n"
consistency:
  description: The leaf and node counts in the table equal the output of examples/cover_count.py.
  example: ../examples/cover_count.py
  compare: output
