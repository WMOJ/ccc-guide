layout: row
panels:
  - { id: d, viz: ArrayViz, title: Python dict }
  - { id: m, viz: ArrayViz, title: C++ std::map }
alt: >-
  The same words are counted into two containers. The Python dict keeps each key in the order it
  first appeared, so a new key goes at the end. A C++ std::map keeps keys sorted, so a new key
  goes in its sorted position. A repeated key only raises its count. After the last word the
  program prints both orders.
captions: vizrec
presets:
  - id: main
    label: Unsorted
    stdin: "d b d a c b\n"
  - id: sorted
    label: Sorted input
    stdin: "a b c\n"
  - id: one
    label: One key
    stdin: "x x x\n"
consistency:
  description: The final order of each container equals the two lines examples/map_order.py prints.
  example: ../examples/map_order.py
  compare: output
