layout: row
panels:
  - { id: t, viz: TreeViz, title: "Sum tree (#i = index)" }
  - { id: v, viz: TableViz, title: Current line }
alt: >-
  A sum tree over six values answering four encrypted lines in order. For each line the last
  answer decodes the real operation. A range question marks the few tree nodes whose sums are
  added, and an update marks the leaf and its ancestors that are recomputed. The presets are the
  four-line example and a second input in which the same raw line is decoded twice.
captions: vizrec
presets:
  - id: main
    label: Four lines
    stdin: "6\n5 3 8 1 4 7\n4\n2 1 4\n1 5 94\n2 2 1\n2 1 3\n"
  - id: same
    label: Same text twice
    stdin: "6\n5 3 8 1 4 7\n4\n2 2 5\n2 2 5\n1 2 34\n2 2 1\n"
consistency:
  description: The answers equal the output of examples/online_tree.py for the same input.
  example: ../examples/online_tree.py
  compare: output
