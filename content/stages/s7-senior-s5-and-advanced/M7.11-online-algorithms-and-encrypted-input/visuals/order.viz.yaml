layout: single
panels:
  - { id: t, viz: TableViz, title: Why the order is fixed }
alt: >-
  A table of encrypted lines. First only the raw text is known. Then a tempting shortcut is shown
  going wrong: either handling two lines in a different order, or copying the answer of a repeated
  line. Finally the lines are decoded in the order given, which produces the real questions. The
  presets use four lines to reorder and two lines with the same raw text.
captions: vizrec
presets:
  - id: reorder
    label: Reorder
    stdin: "6\n5 3 8 1 4 7\n4\n2 1 4\n1 5 94\n2 2 1\n2 1 3\n"
  - id: repeat
    label: Repeated line
    stdin: "6\n5 3 8 1 4 7\n4\n2 2 5\n2 2 5\n1 2 34\n2 2 1\n"
consistency:
  description: The answers of the correct order equal the output of examples/online_tree.py for the same input.
  example: ../examples/online_tree.py
  compare: output
