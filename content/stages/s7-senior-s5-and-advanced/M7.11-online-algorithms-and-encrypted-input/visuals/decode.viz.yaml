layout: single
panels:
  - { id: t, viz: TableViz, title: Decoding each line }
alt: >-
  A table of encrypted query lines. Each line is decoded, one at a time, with the answer to the
  latest range question, which is shown in a last column and linked by an arrow to the answer it
  came from. The decoded column shows the real update or range, and the answer column shows the
  result. The presets use four lines with an update, and two range lines whose raw text is the
  same.
captions: vizrec
presets:
  - id: main
    label: Four lines
    stdin: "6\n5 3 8 1 4 7\n4\n2 1 4\n1 5 94\n2 2 1\n2 1 3\n"
  - id: same
    label: Same text twice
    stdin: "6\n5 3 8 1 4 7\n4\n2 2 5\n2 2 5\n1 2 34\n2 2 1\n"
consistency:
  description: The answers equal the output of examples/online_tree.py for the same input.
  example: ../examples/online_tree.py
  compare: output
