layout: single
panels:
  - { id: t, viz: TreeViz, title: "Sum tree (#i = index)" }
alt: >-
  A segment tree for sums is built from the bottom up. The array values sit in the leaves, then
  each internal node, from the last one back to the root, is filled in as the sum of its two
  children. The first preset has six values, padded to eight leaves with zeros that are not drawn. The second has four values and needs no padding.
captions: vizrec
legendLabels:
  current: Node being filled
  compare: Its two children
presets:
  - id: six
    label: Six, padded
    stdin: "6\n5 3 8 1 4 7\n"
  - id: four
    label: Four values
    stdin: "4\n5 3 8 1\n"
consistency:
  description: The finished tree array equals the output of examples/tree_build.py.
  example: ../examples/tree_build.py
  compare: output
