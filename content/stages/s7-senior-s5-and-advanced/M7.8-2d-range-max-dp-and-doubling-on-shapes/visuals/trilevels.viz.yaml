layout: row
panels:
  - { id: a, viz: GridViz, title: Level below }
  - { id: b, viz: GridViz, title: New level }
alt: >-
  A triangle of numbers stored as a grid, beside the next size of triangle maxima. Each new size
  is built from three lookups in the size below, one at the apex and two at the bottom corners of
  the new triangle. The sizes grow 1, 2, 3, 5 and so on, about doubling each time, until the wanted
  size is reached, and the last step lists the maximum of every triangle of that size.
legendLabels:
  compare: Read for this cell
  current: Being computed
  wall: No triangle here
captions: vizrec
