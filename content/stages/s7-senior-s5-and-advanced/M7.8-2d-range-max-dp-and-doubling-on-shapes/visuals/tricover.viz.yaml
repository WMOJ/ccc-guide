layout: single
panels:
  - { id: g, viz: GridViz, title: Triangle }
alt: >-
  A triangle of numbers with one triangle of the wanted size marked at the apex. Three smaller
  triangles, one at the apex and two at the bottom corners, are laid over it one at a time. Cells
  in one of them are marked, cells in two or more are marked differently, and every cell ends up
  covered, so the maximum of the three maxima is the maximum of the whole triangle.
legendLabels:
  frontier: Not yet covered
  done: In one triangle
  compare: In two or more triangles
  wall: Outside the triangle
captions: vizrec
presets:
  - id: size5
    label: Size 5
    stdin: "6 5\n17\n8 21\n15 6 30\n9 25 2 18\n14 7 22 11 5\n1 19 10 26 13 20\n"
  - id: size4
    label: Size 4
    stdin: "6 4\n17\n8 21\n15 6 30\n9 25 2 18\n14 7 22 11 5\n1 19 10 26 13 20\n"
  - id: size2
    label: Size 2
    stdin: "6 2\n17\n8 21\n15 6 30\n9 25 2 18\n14 7 22 11 5\n1 19 10 26 13 20\n"
consistency:
  description: The final rows of maxima equal the output of examples/triangle_doubling.py on the same input.
  example: ../examples/triangle_doubling.py
  compare: output
