layout: single
panels:
  - { id: g, viz: GridViz, title: Grid }
alt: >-
  A 6 by 6 grid with a square query marked. Four blocks whose side is the largest power of two that
  fits are laid over the four corners of the square, one at a time. Cells covered by one block are
  marked, cells covered by two or more blocks are marked differently, and the answer is the maximum
  of the four block maximums.
legendLabels:
  frontier: Not yet covered
  done: In one block
  compare: In two or more blocks
captions: vizrec
