layout: row
panels:
  - { id: src, viz: GridViz, title: Source blocks }
  - { id: dst, viz: GridViz, title: Level being built }
alt: >-
  A grid of numbers beside the next level of the table. Each new cell is the maximum of four cells
  of the level before it, offset by half the block side, so each level holds the maximum of every
  block twice as wide and twice as tall. The last step answers a query of the whole grid from
  the four blocks that cover it.
legendLabels:
  compare: Read for this cell
  current: Being computed
captions: vizrec
presets:
  - id: main
    label: 4 by 4
    stdin: "4\n5 2 9 1\n7 3 6 8\n4 10 2 12\n11 1 5 3\n1\n0 0 4\n"
  - id: five
    label: 5 by 5
    stdin: "5\n12 2 9 1 4\n7 3 6 8 2\n4 10 2 12 6\n11 1 5 3 7\n8 6 1 9 2\n1\n0 0 5\n"
  - id: small
    label: 3 by 3
    stdin: "3\n1 5 9\n3 1 4\n2 6 5\n1\n0 0 3\n"
consistency:
  description: The final answer equals the output of examples/range_max_2d.py on the same input.
  example: ../examples/range_max_2d.py
  compare: output
