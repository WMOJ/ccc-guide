layout: single
panels:
  - { id: arr, viz: ArrayViz, title: Days }
alt: >-
  A row of seven days, sunny or not. A pointer moves across them one at a time, while the
  caption tracks the current sunny run and the best run seen so far.
captions: vizrec
presets:
  - id: sample
    label: Seven days
    stdin: "7\n1 1 0 1 1 1 0\n"
consistency:
  description: The final best run in the visual equals the output of examples/sunny_streak.py.
  example: ../examples/sunny_streak.py
  compare: output
