layout: single
panels:
  - { id: t, viz: TableViz, title: Pair sums }
alt: >-
  A table of four ticket prices against themselves, filled in one pair at a time with the
  sum of that pair, checked against the target of 10.
captions: vizrec
presets:
  - id: sample
    label: Four tickets
    stdin: "4 10\n3 5 2 8\n"
consistency:
  description: The count of matching pairs in the visual equals the output of examples/ticket_pairs.py.
  example: ../examples/ticket_pairs.py
  compare: output
