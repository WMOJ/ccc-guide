layout: single
panels:
  - { id: grid, viz: GridViz, title: "Pairs (i, j) counted" }
legendLabels:
  wall: Never visited
alt: >-
  A square grid with rows for i and columns for j. Row by row, the cells to the right of the
  diagonal fill in with the running count as the inner loop visits them. Cells on or left of the
  diagonal are never visited, so the filled cells form a triangle holding n(n-1)/2 pairs.
captions: vizrec
presets:
  - id: main
    label: "n = 6"
    stdin: "6\n"
  - id: four
    label: "n = 4"
    stdin: "4\n"
  - id: tiny
    label: "n = 1"
    stdin: "1\n"
consistency:
  description: The final count equals the output of examples/count_pairs.py on each preset's n.
  example: ../examples/count_pairs.py
  compare: output
