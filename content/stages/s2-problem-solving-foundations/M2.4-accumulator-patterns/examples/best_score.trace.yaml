example: best_score.py
alt: >-
  The program scans three scores, keeping the best score and the name that reached it.
  A later tie does not replace the leader, so the earliest player to reach the best
  score keeps the lead.
notes:
  "5": "`best_score` and `leader` are seeded from the first player, A, before the loop starts."
  "11": "B's `9` beats A's `7`, so both accumulators move to B."
  "9@2": "`cur > best_score` is strict. C's `9` only ties B's, so the lead stays with B."
