layout: row
panels:
  - { id: arr, viz: ArrayViz, title: Arrivals per minute }
  - { id: q, viz: StructViz, title: Line }
alt: >-
  Five minutes of a library line. Each minute's arrivals join the line, the longest length
  so far is checked, and then one patron is served if the line is not empty.
captions: vizrec
presets:
  - id: sample
    label: Five minutes
    stdin: "5\n2 0 1 3 0\n"
consistency:
  description: The final longest-line value in the visual equals the output of examples/library_line.py.
  example: ../examples/library_line.py
  compare: output
