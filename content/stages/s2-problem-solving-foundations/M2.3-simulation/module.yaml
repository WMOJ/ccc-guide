    note: Track two players' scores through a dice game, round by round.
    why: An early Junior problem, included here for extra practice.
  - id: ccc15j4
    note: Find how long you kept each friend waiting for a reply, from a log of messages.
    why: A Junior problem, included here for extra practice.
