# content/glossary.yaml — Glossary of competitive programming and Python terms.
#
# term -> definition, introducedIn (<moduleId>/<lessonSlug>)
# Checked by G-SCHEMA and G-PREREQ.

terms:
  - id: variable
    term: variable
    definition: A name that refers to a value stored while a program runs.
    introducedIn: M1.1/variables-and-print
  - id: assignment
    term: assignment
    definition: Storing a value under a variable name using the equals sign.
    introducedIn: M1.1/variables-and-print
  - id: type
    term: type
    definition: The classification of a value, such as an integer, string, or boolean, that determines what operations it supports.
    introducedIn: M1.1/variables-and-print
  - id: reassignment
    term: reassignment
    definition: Binding an existing variable name to a new value.
    introducedIn: M1.1/variables-and-print
  - id: interpreter
    term: interpreter
    definition: The program that reads Python source code and runs it, one instruction at a time.
    introducedIn: M0.1/what-a-program-is
  - id: algorithm
    term: algorithm
    definition: A precise, step-by-step method for solving a problem.
  - id: breadth-first-search
    term: breadth-first search
    definition: A graph traversal algorithm that explores vertices level by level in order of distance from the source.
    introducedIn: M4.13/bfs-and-flood-fill
  - id: flood-fill
    term: flood fill
    definition: An algorithm that identifies and visits all connected cells matching a condition in a 2D grid.
    introducedIn: M4.13/bfs-and-flood-fill
  - id: queue
    term: queue
    definition: A first-in, first-out data structure where elements are added at the back and removed from the front.
    introducedIn: M4.13/bfs-and-flood-fill
  - id: dijkstras-algorithm
    term: Dijkstra's algorithm
    definition: An algorithm that finds the shortest path from a start node to all other nodes in a graph with non-negative edge weights.
    introducedIn: M6.1/dijkstras-algorithm
  - id: priority-queue
    term: priority queue
    definition: A data structure that retrieves the item with the smallest (or largest) priority key first.
    introducedIn: M6.1/dijkstras-algorithm
  - id: operator
    term: operator
    definition: A symbol such as `+` or `//` that performs a computation on one or more values.
    introducedIn: M1.2/integer-arithmetic-and-operators
  - id: floor-division
    term: floor division
    definition: Division that rounds the exact answer down to a whole number, written `//`.
    introducedIn: M1.2/integer-arithmetic-and-operators
  - id: modulo
    term: modulo
    definition: The remainder left over after floor division, written `%`.
    introducedIn: M1.2/integer-arithmetic-and-operators
  - id: true-division
    term: true division
    definition: Division written with `/` that always produces a float, even when the numbers divide evenly.
    introducedIn: M1.2/integer-arithmetic-and-operators
  - id: augmented-assignment
    term: augmented assignment
    definition: A shorthand such as `+=` that updates a variable using its own current value in one step.
    introducedIn: M1.2/integer-arithmetic-and-operators
  - id: precedence
    term: precedence
    definition: The fixed order in which Python runs the operators in a line that has more than one. Parentheses change that order.
    introducedIn: M1.2/integer-arithmetic-and-operators
  - id: ceiling-division
    term: ceiling division
    definition: Division that rounds a result up to the next whole number when there is a remainder, computed as `-(-a // b)`.
    introducedIn: M1.12/floats-precision-and-big-integers
  - id: standard-library
    term: standard library
    definition: The collection of modules that ships with Python itself, without installing anything extra.
    introducedIn: M1.13/imports-and-the-standard-library-tour
  - id: recursion
    term: recursion
    definition: A function calling itself to solve a smaller version of the same problem.
    introducedIn: M1.14/recursion-fundamentals
  - id: call-stack
    term: call stack
    definition: The stack of frames for every function call currently in progress, most recent on top.
    introducedIn: M1.14/recursion-fundamentals
  - id: walrus-operator
    term: walrus operator
    definition: The `:=` operator, which assigns a value to a name inside a larger expression instead of on its own line.
    introducedIn: M1.15/the-python-3-8-language-boundary
  - id: source-code
    term: source code
    definition: The plain text you write that describes what you want a program to do, before anything runs it.
    introducedIn: M0.1/what-a-program-is
  - id: standard-input
    term: standard input
    definition: The stream of text a program reads its input from, normally whatever the judge feeds it.
    introducedIn: M0.4/the-standard-input-output-model-and-exact-output
  - id: standard-output
    term: standard output
    definition: The stream of text a program writes its output to, normally what the judge reads and compares.
    introducedIn: M0.4/the-standard-input-output-model-and-exact-output
  - id: accumulator
    term: accumulator
    definition: A variable that carries a running result forward through a loop, updated once per item.
    introducedIn: M2.4/accumulator-patterns
  - id: subtask
    term: subtask
    definition: A named group of hidden test cases within one problem, run and reported together as a batch.
    introducedIn: M0.5/how-judging-works
  - id: verdict
    term: verdict
    definition: The judge's recorded result for one test case, such as accepted or wrong answer.
    introducedIn: M0.5/how-judging-works
  - id: simulation
    term: simulation
    definition: Solving a problem by running its described process step by step, with a variable for each piece of state.
    introducedIn: M2.3/simulation
  - id: traceback
    term: traceback
    definition: The message Python prints when a program stops with an error, naming the file, the line, and the error itself.
    introducedIn: M0.6/reading-error-messages
  - id: brute-force
    term: brute force
    definition: Solving a problem by checking every candidate answer directly, with no shortcut.
    introducedIn: M2.5/brute-force-and-complete-search
  - id: method
    term: method
    definition: A function called on a value using a dot, such as `.split()` called on a string.
    introducedIn: M1.3/reading-input
  - id: multiple-assignment
    term: multiple assignment
    definition: Assigning several values to several names in one line, matched left to right by position.
    introducedIn: M1.3/reading-input
  - id: comparison-operator
    term: comparison operator
    definition: "An operator that compares two values and gives back a boolean, such as `==`, `<`, or `in`."
    introducedIn: M1.4/booleans-and-conditionals
  - id: boolean-operator
    term: boolean operator
    definition: An operator that combines or inverts boolean values, such as `and`, `or`, and `not`.
    introducedIn: M1.4/booleans-and-conditionals
  - id: conditional-expression
    term: conditional expression
    definition: "A one-line either/or expression of the form `a if condition else b`, which evaluates to `a` or `b` depending on the condition."
    introducedIn: M1.4/booleans-and-conditionals
  - id: edge-case
    term: edge case
    definition: An input at the extreme or unusual end of what a problem's bounds allow, such as the smallest size, every value equal, or a tie.
    introducedIn: M2.6/case-analysis-and-edge-cases
  - id: aliasing
    term: aliasing
    definition: Two names that refer to the exact same list or other mutable value, so a change made through one name shows up when the other is read.
    introducedIn: M2.8/debugging
  - id: list-comprehension
    term: list comprehension
    definition: "A one-line way to build a list from an existing sequence, written `[expression for name in sequence]`, optionally filtered with `if`."
    introducedIn: M1.8/lists-1d-and-2d
  - id: generator-expression
    term: generator expression
    definition: "The same shape as a list comprehension without square brackets, producing values one at a time instead of building a whole list."
    introducedIn: M1.8/lists-1d-and-2d
  - id: local
    term: local
    definition: A variable that exists only inside the function call that created it, separate from any variable of the same name outside that function.
    introducedIn: M1.10/functions-and-scope
  - id: greedy-algorithm
    term: greedy algorithm
    definition: An algorithm that solves a problem by making locally optimal choices at each step without reconsidering earlier decisions.
    introducedIn: M4.2/sorting-with-keys-and-greedy
  - id: greedy-choice-property
    term: greedy choice property
    definition: A property of optimization problems where a globally optimal solution always includes a locally optimal (greedy) choice made at the first step.
    introducedIn: M4.2/sorting-with-keys-and-greedy
  - id: prefix-sum
    term: prefix sum
    definition: An array where each element stores the cumulative sum of all elements up to that index, enabling O(1) range-sum queries.
    introducedIn: M4.3/prefix-sums
  - id: difference-array
    term: difference array
    definition: An array storing the differences between consecutive elements, used to apply multiple range updates in O(1) time per update.
    introducedIn: M4.4/difference-arrays
  - id: invariant
    term: invariant
    definition: A property or quantity that remains unchanged through a series of operations or transformations.
    introducedIn: M4.5/mathematical-insight
  - id: disjoint-set-union
    term: disjoint set union
    definition: A data structure that tracks which elements belong to the same group, supporting fast union and connectivity queries.
    introducedIn: M5.10/union-find-connectivity
  - id: union-find
    term: union-find
    definition: Another name for disjoint set union; commonly used when describing the find and union operations.
    introducedIn: M5.10/union-find-connectivity
  - id: path-halving
    term: path halving
    definition: An optimization in the find operation where each node points to its grandparent instead of its parent, flattening the tree over time.
    introducedIn: M5.10/union-find-connectivity
  - id: union-by-size
    term: union by size
    definition: An optimization where the smaller tree is always attached under the larger tree during union, keeping the forest shallow.
    introducedIn: M5.10/union-find-connectivity
  - id: lazy-deletion
    term: lazy deletion
    definition: An optimization technique where items are marked invalid instead of being removed immediately, with removal deferred until they are popped.
    introducedIn: M5.11/heaps-and-lazy-deletion
  - id: deque
    term: double-ended queue (deque)
    definition: A data structure that supports efficient insertion and removal at both ends, useful for sliding window problems.
    introducedIn: M5.11/heaps-and-lazy-deletion
  - id: sparsification
    term: Sparsification
    definition: The process of reducing a graph or state space by keeping only the nodes and edges that can actually be reached or are needed to solve the problem, discarding theoretical possibilities that never arise in practice.
    introducedIn: M6.2/state-space-modelling
  - id: minimum-spanning-tree
    term: Minimum spanning tree
    definition: A spanning tree of a graph with the smallest total edge weight. Connects all nodes using the fewest or cheapest edges.
    introducedIn: M6.3/kruskal-mst
  - id: tree-edge
    term: Tree edge
    definition: An edge in a DFS that leads to a node being visited for the first time. Tree edges form the DFS tree.
    introducedIn: M6.4/dfs-tree
  - id: back-edge
    term: Back edge
    definition: An edge in a DFS that points to an ancestor in the DFS tree. Back edges indicate cycles in a directed graph.
    introducedIn: M6.4/dfs-tree
  - id: interval-dp
    term: Interval DP
    definition: A dynamic programming technique where subproblems are defined on contiguous intervals of a sequence, solved bottom-up by increasing interval length.
    introducedIn: M6.6/interval-dp
  - id: monotonic-stack
    term: monotonic stack
    definition: A stack storing elements in monotonic order, used to efficiently find the next greater element.
    introducedIn: M6.11/monotonic-structures
  - id: monotonic-deque
    term: monotonic deque
    definition: A double-ended queue maintaining elements in monotonic order to track sliding window maximum.
    introducedIn: M6.11/monotonic-structures
  - id: coordinate-compression
    term: coordinate compression
    definition: Mapping large coordinate values to small ranks to enable dense array storage for sparse 2D problems.
    introducedIn: M6.8/coordinate-compression
  - id: segment-tree
    term: segment tree
    definition: A tree data structure that stores partial answers about ranges, enabling point updates and range queries in logarithmic time.
    introducedIn: M7.1/segment-tree-structure
  - id: sparse-table
    term: sparse table
    definition: A precomputed table for answering idempotent range queries (minimum, maximum, gcd) in constant time after O(N log N) preprocessing.
    introducedIn: M7.3/sparse-table-queries
  - id: vertex
    term: vertex
    definition: A single node in a graph; the thing that edges connect.
    introducedIn: M4.12/graphs-and-adjacency-lists
  - id: edge
    term: edge
    definition: A connection between two vertices in a graph, sometimes carrying a weight.
    introducedIn: M4.12/graphs-and-adjacency-lists
  - id: adjacency-list
    term: adjacency list
    definition: A way to store a graph as a list or dictionary that maps each vertex to the list of its neighbours.
    introducedIn: M4.12/graphs-and-adjacency-lists
  - id: circular-array
    term: circular array
    definition: An array whose index wraps from the last element back to the first, usually with the modulo operator.
    introducedIn: M4.15/circular-arrays-and-wraparound
  - id: hash-collision
    term: hash collision
    definition: Two different inputs that produce the same hash value. Rare with a good hash and a large modulus, but never impossible.
    introducedIn: M5.4/rolling-hash
