startPage:
  title: Start here
  lede: What this course covers, how to read a module, and where you practise.
  sections:
    - heading: What the CCC is
      paragraphs:
        - The Canadian Computing Competition (CCC) is a programming contest that the University of
          Waterloo runs every year. It has a Junior contest and a Senior contest, with five problems
          in each.
        - This course teaches the Python and the problem-solving ideas those problems use. It
          starts at your first line of code, so you do not need to know any programming yet.
    - heading: How to read a module
      paragraphs:
        - Read the modules in order. Each one explains one idea and shows it working on a small
          program.
        - Many modules include a step-through. It runs a program or an algorithm one step at a time,
          and you choose when to take the next step.
        - When you finish a module, mark it as read. The mark is saved in this browser, and the home
          page uses it to send you back to where you stopped.
    - heading: How practice works
      paragraphs:
        - Most modules end with a short list of real CCC problems. You solve them on WMOJ or DMOJ,
          two online judges. A judge runs your program on the official test data and tells you
          whether it passed.
        - Each practice link opens the problem on its judge. To submit a solution, you need a free
          account on that judge.
    - heading: What you need
      paragraphs:
        - You need a way to write and run Python programs. This course teaches Python and contest
          techniques. It does not explain how to install software or set up a computer.
aboutPage:
  title: About
  lede: Who made the problems, where you practise them, and what this course keeps about you.
  sections:
    - heading: About this course
      paragraphs:
        - This course is free and non-commercial. There are no accounts and no ads. Your read marks
          are saved in this browser and are never sent anywhere.
    - heading: Credits
      paragraphs:
        - CCC problems and contest materials are written by the Centre for Education in Mathematics
          and Computing (CEMC) at the University of Waterloo, and are used here under CC BY-NC 4.0.
          This course is not affiliated with or endorsed by the CEMC.
    - heading: Judges
      paragraphs:
        - Practice links go to WMOJ and DMOJ, two independent online judges that host CCC problems.
          This course is not affiliated with either judge.
