# content/course.yaml
#
# Ordered stages -> modules. No system/environment setup content (M0.2 and M0.3 were dropped as
# setup-only; M7.14, the C++ bridge, is kept with no setup framing).
# Every module starts "planned" (renders as "Coming soon", no link, draft visibility)
# until written. Stage and module "goal"/"title" text here is neutral and score-free by
# hand: score/CCO/medal wording and "Contest payoff" framing must never show in the app.
#
# A module's title here is its only title: it is the module page's H1, and the course map,
# sidebar, breadcrumb, search and prev/next links all show it. The module's own folder holds
# its status, objectives and practice list (module.yaml) and its page body (module.mdx).

stages:
  - id: s0
    number: "0"
    title: Orientation
    goal: Understand what a program is, how exact-match judging works, and how to read an error message.
    modules:
      - id: M0.1
        title: What a program is
        status: accepted
      - id: M0.4
        title: The standard input/output model and exact output
        status: accepted
      - id: M0.5
        title: How judging works
        status: accepted
      - id: M0.6
        title: Reading error messages
        status: accepted
      - id: M0.7
        title: "Online judges: WMOJ and DMOJ"
        status: accepted
